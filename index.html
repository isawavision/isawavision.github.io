<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>isawavision</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
}

body, html {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: #0a0a0a;
    color: #ffffff;
}

.bg-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    overflow: hidden;
    background: #0a0a0a;
}

.bg-blur {
    position: absolute;
    top: -20%;
    left: -20%;
    width: 140vw;
    height: 140vh;
    background-size: cover;
    background-position: center;
    filter: blur(80px) saturate(180%);
    opacity: 0.45;
    transform: scale(1.1);
    transition: background-image 1.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.bg-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, rgba(10,10,10,0.2) 0%, rgba(10,10,10,0.85) 100%);
}

.app-container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 8vw;
    gap: 8vw;
    position: relative;
}

.app-container.no-lyrics {
    justify-content: center;
    gap: 0;
}

.app-container.no-lyrics .lyrics-section {
    display: none;
}

.app-container.no-lyrics .player-section {
    transform: scale(1.05);
}

.player-section {
    flex: 0 0 auto;
    width: 340px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 2;
}

.artwork-wrapper {
    width: 340px;
    height: 340px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
    position: relative;
    background: #181818;
    transform: translateZ(0);
}

.artwork-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
}

.track-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.track-title {
    font-size: 22px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.track-artist {
    font-size: 15px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.6);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.progress-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 4px;
}

.progress-bar-bg {
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 2px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
}

.progress-bar-fill {
    height: 100%;
    background: #ffffff;
    width: 0%;
    border-radius: 2px;
    transition: width 0.1s linear;
}

.progress-times {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.4);
    font-variant-numeric: tabular-nums;
}

.lyrics-section {
    flex: 1;
    height: 70vh;
    max-width: 600px;
    position: relative;
    overflow: hidden;
    mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
    z-index: 2;
}

.lyrics-scroll {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 28px;
    padding: 35vh 0;
    transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
}

.lyric-line {
    font-size: 32px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.25);
    line-height: 1.3;
    letter-spacing: -0.02em;
    cursor: pointer;
    transition: color 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
    transform-origin: left center;
}

.lyric-line.active {
    color: #ffffff;
    transform: scale(1.02);
    text-shadow: 0 0 30px rgba(255,255,255,0.3);
}

.lyric-line.past {
    color: rgba(255, 255, 255, 0.35);
}

.adlib {
    display: inline-block;
    font-size: 18px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.3);
    margin-left: 12px;
    font-style: italic;
    transition: color 0.4s ease;
}

.lyric-line.active .adlib {
    color: rgba(255, 255, 255, 0.6);
}

.auth-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 100;
    transition: opacity 0.6s ease;
}

.auth-screen.hidden {
    opacity: 0;
    pointer-events: none;
}

.auth-title {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -0.03em;
}

.auth-subtitle {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.5);
    font-weight: 400;
}

.auth-btn {
    background: #1db954;
    color: #ffffff;
    border: none;
    padding: 16px 36px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease;
    box-shadow: 0 10px 30px rgba(29, 185, 84, 0.3);
}

.auth-btn:hover {
    background: #1ed760;
    transform: scale(1.05);
}

.fullscreen-btn {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #ffffff;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(10px);
    z-index: 10;
    transition: background 0.2s ease, transform 0.2s ease;
}

.fullscreen-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(1.05);
}

.waiting-state {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
}

.waiting-state.visible {
    opacity: 1;
}

.waiting-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.01em;
}

.waiting-subtitle {
    font-size: 15px;
    color: rgba(255, 255, 255, 0.5);
}

@media(max-width: 900px) {
    .app-container {
        flex-direction: column;
        justify-content: center;
        padding: 4vh 6vw;
        gap: 5vh;
    }
    .player-section {
        width: 260px;
    }
    .artwork-wrapper {
        width: 260px;
        height: 260px;
    }
    .lyrics-section {
        width: 100%;
        height: 40vh;
        max-width: 100%;
        mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
    }
    .lyric-line {
        font-size: 22px;
        text-align: center;
    }
    .lyrics-scroll {
        align-items: center;
        padding: 20vh 0;
    }
    .app-container.no-lyrics .lyrics-section {
        display: none;
    }
}
</style>
</head>
<body>

<div class="auth-screen" id="authScreen">
    <div class="auth-title">isawavision</div>
    <div class="auth-subtitle">Connect your Spotify account to experience immersive synchronized lyrics.</div>
    <button class="auth-btn" id="loginBtn">Connect Spotify</button>
</div>

<div class="bg-container">
    <div class="bg-blur" id="bgBlur"></div>
    <div class="bg-overlay"></div>
</div>

<div class="waiting-state" id="waitingState">
    <div class="waiting-title">Waiting for music</div>
    <div class="waiting-subtitle">Play a track on Spotify to begin</div>
</div>

<div class="app-container" id="appContainer">
    <div class="player-section">
        <div class="artwork-wrapper">
            <img id="artwork" src="" alt="Album Art">
        </div>
        <div class="track-info">
            <div class="track-title" id="trackTitle"></div>
            <div class="track-artist" id="trackArtist"></div>
        </div>
        <div class="progress-container">
            <div class="progress-bar-bg" id="progressBarBg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
            <div class="progress-times">
                <span id="currentTime">0:00</span>
                <span id="durationTime">0:00</span>
            </div>
        </div>
    </div>

    <div class="lyrics-section" id="lyricsSection">
        <div class="lyrics-scroll" id="lyricsScroll"></div>
    </div>
</div>

<button class="fullscreen-btn" id="fullscreenBtn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
</button>

<script>
const CLIENT_ID = 'ff5af985ee254039b6d172039edeea90';
const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPES = 'user-read-playback-state user-read-currently-playing';

const authScreen = document.getElementById('authScreen');
const loginBtn = document.getElementById('loginBtn');
const appContainer = document.getElementById('appContainer');
const bgBlur = document.getElementById('bgBlur');
const artwork = document.getElementById('artwork');
const trackTitle = document.getElementById('trackTitle');
const trackArtist = document.getElementById('trackArtist');
const progressBarFill = document.getElementById('progressBarFill');
const progressBarBg = document.getElementById('progressBarBg');
const currentTimeEl = document.getElementById('currentTime');
const durationTimeEl = document.getElementById('durationTime');
const lyricsScroll = document.getElementById('lyricsScroll');
const waitingState = document.getElementById('waitingState');
const fullscreenBtn = document.getElementById('fullscreenBtn');

let accessToken = localStorage.getItem('spotify_access_token');
let currentTrackId = null;
let parsedLyrics = [];
let activeLyricIndex = -1;
let trackDuration = 0;
let trackProgress = 0;
let isPlaying = false;
let lastProgressFetch = 0;
let localProgressOffset = 0;
let animationFrameId = null;

if (window.location.hash) {
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    const token = hashParams.get('access_token');
    if (token) {
        accessToken = token;
        localStorage.setItem('spotify_access_token', token);
        window.location.hash = '';
    }
}

if (accessToken) {
    authScreen.classList.add('hidden');
    startPlayerLoop();
}

loginBtn.addEventListener('click', () => {
    const authUrl = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(SCOPES)}`;
    window.location.href = authUrl;
});

fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
});

function formatTime(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
}

async function fetchCurrentlyPlaying() {
    try {
        const response = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
            headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        
        if (response.status === 401) {
            localStorage.removeItem('spotify_access_token');
            authScreen.classList.remove('hidden');
            return;
        }

        if (response.status === 204 || response.status === 205) {
            handleNoMusic();
            return;
        }

        const data = await response.json();
        if (!data || !data.item) {
            handleNoMusic();
            return;
        }

        updateTrackData(data);
    } catch (e) {
    }
}

function handleNoMusic() {
    isPlaying = false;
    waitingState.classList.add('visible');
    appContainer.style.opacity = '0.3';
}

let lastFetchedTrackKey = '';

async function updateTrackData(data) {
    waitingState.classList.remove('visible');
    appContainer.style.opacity = '1';

    isPlaying = data.is_playing;
    trackProgress = data.progress_ms;
    trackDuration = data.item.duration_ms;
    lastProgressFetch = performance.now();
    localProgressOffset = trackProgress;

    const newTrackId = data.item.id;
    const trackName = data.item.name;
    const artistName = data.item.artists.map(a => a.name).join(', ');
    const albumCover = data.item.album.images[0]?.url || '';
    const albumName = data.item.album.name;

    const trackKey = newTrackId + trackName;

    if (currentTrackId !== newTrackId) {
        currentTrackId = newTrackId;
        trackTitle.textContent = trackName;
        trackArtist.textContent = artistName;
        artwork.src = albumCover;
        bgBlur.style.backgroundImage = `url(${albumCover})`;

        if (trackKey !== lastFetchedTrackKey) {
            lastFetchedTrackKey = trackKey;
            await fetchLyrics(artistName, trackName, albumName, trackDuration);
        }
    }

    updateProgressUI();
}

async function fetchLyrics(artist, track, album, duration) {
    parsedLyrics = [];
    lyricsScroll.innerHTML = '';
    appContainer.classList.add('no-lyrics');

    try {
        const cleanArtist = artist.split(',')[0].trim();
        const cleanTrack = track.replace(/\([^)]*\)/g, '').trim();
        const durationSec = Math.round(duration / 1000);

        let url = `https://lrclib.net/api/get?artist_name=${encodeURIComponent(cleanArtist)}&track_name=${encodeURIComponent(cleanTrack)}&album_name=${encodeURIComponent(album)}&duration=${durationSec}`;
        let res = await fetch(url);
        
        if (!res.ok) {
            url = `https://lrclib.net/api/search?q=${encodeURIComponent(cleanArtist + ' ' + cleanTrack)}`;
            res = await fetch(url);
            if (res.ok) {
                const searchData = await res.json();
                if (searchData && searchData.length > 0) {
                    const match = searchData.find(item => item.syncedLyrics);
                    if (match) {
                        processSyncedLyrics(match.syncedLyrics);
                        return;
                    }
                }
            }
        } else {
            const data = await res.json();
            if (data && data.syncedLyrics) {
                processSyncedLyrics(data.syncedLyrics);
                return;
            }
        }

        url = `https://lrclib.net/api/search?q=${encodeURIComponent(track)}`;
        res = await fetch(url);
        if (res.ok) {
            const searchData = await res.json();
            if (searchData && searchData.length > 0) {
                const match = searchData.find(item => item.syncedLyrics);
                if (match) {
                    processSyncedLyrics(match.syncedLyrics);
                    return;
                }
            }
        }
    } catch (e) {
    }
}

function processSyncedLyrics(lrcString) {
    const lines = lrcString.split('\n');
    const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
    
    parsedLyrics = [];

    for (let line of lines) {
        const match = line.match(regex);
        if (match) {
            const minutes = parseInt(match[1], 10);
            const seconds = parseInt(match[2], 10);
            const millisPart = match[3];
            const millis = millisPart.length === 2 ? parseInt(millisPart, 10) * 10 : parseInt(millisPart, 10);
            const timeMs = (minutes * 60 + seconds) * 1000 + millis;
            const text = match[4].trim();

            if (text) {
                parsedLyrics.push({ timeMs, text });
            }
        }
    }

    if (parsedLyrics.length > 0) {
        appContainer.classList.remove('no-lyrics');
        renderLyricsDOM();
    }
}

function renderLyricsDOM() {
    lyricsScroll.innerHTML = '';
    parsedLyrics.forEach((lyric, index) => {
        const div = document.createElement('div');
        div.className = 'lyric-line';
        div.dataset.index = index;

        let rawText = lyric.text;
        const parentMatch = rawText.match(/(.*?)\s*\(([^)]+)\)\s*(.*)/);
        
        if (parentMatch && (parentMatch[2].toLowerCase().includes('yeah') || parentMatch[2].toLowerCase().includes('ooh') || parentMatch[2].toLowerCase().includes('ah') || parentMatch[2].toLowerCase().includes('repeat') || parentMatch[2].length < 20)) {
            const mainText = (parentMatch[1] + ' ' + parentMatch[3]).trim();
            const adlibText = parentMatch[2].trim();
            div.innerHTML = `${mainText} <span class="adlib">(${adlibText})</span>`;
        } else {
            div.textContent = rawText;
        }

        div.addEventListener('click', () => {
            seekToPosition(lyric.timeMs);
        });

        lyricsScroll.appendChild(div);
    });
}

async function seekToPosition(ms) {
    try {
        await fetch(`https://api.spotify.com/v1/me/player/seek?position_ms=${ms}`, {
            method: 'PUT',
            headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        localProgressOffset = ms;
        lastProgressFetch = performance.now();
        trackProgress = ms;
        updateProgressUI();
    } catch (e) {
    }
}

function updateProgressUI() {
    if (trackDuration > 0) {
        const pct = Math.min(100, Math.max(0, (trackProgress / trackDuration) * 100));
        progressBarFill.style.width = pct + '%';
        currentTimeEl.textContent = formatTime(trackProgress);
        durationTimeEl.textContent = formatTime(trackDuration);
    }
    updateActiveLyric();
}

function updateActiveLyric() {
    if (parsedLyrics.length === 0) return;

    let targetIndex = -1;
    for (let i = 0; i < parsedLyrics.length; i++) {
        if (trackProgress >= parsedLyrics[i].timeMs) {
            targetIndex = i;
        } else {
            break;
        }
    }

    if (targetIndex !== activeLyricIndex) {
        activeLyricIndex = targetIndex;
        const lineElements = lyricsScroll.children;
        for (let i = 0; i < lineElements.length; i++) {
            const el = lineElements[i];
            el.classList.remove('active', 'past');
            if (i === activeLyricIndex) {
                el.classList.add('active');
            } else if (i < activeLyricIndex) {
                el.classList.add('past');
            }
        }

        if (activeLyricIndex >= 0 && lineElements[activeLyricIndex]) {
            const activeEl = lineElements[activeLyricIndex];
            const containerHeight = lyricsScroll.parentElement.clientHeight;
            const offsetTop = activeEl.offsetTop;
            const scrollTarget = offsetTop - (containerHeight / 2) + (activeEl.clientHeight / 2);
            lyricsScroll.style.transform = `translateY(-${Math.max(0, scrollTarget)}px)`;
        }
    }
}

function playerLoop(timestamp) {
    if (isPlaying) {
        const elapsed = timestamp - lastProgressFetch;
        trackProgress = localProgressOffset + elapsed;
        if (trackProgress > trackDuration) {
            trackProgress = trackDuration;
        }
        updateProgressUI();
    }
    animationFrameId = requestAnimationFrame(playerLoop);
}

animationFrameId = requestAnimationFrame(playerLoop);

setInterval(() => {
    if (accessToken) {
        fetchCurrentlyPlaying();
    }
}, 1000);

progressBarBg.addEventListener('click', (e) => {
    const rect = progressBarBg.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const width = rect.width;
    const pct = clickX / width;
    const targetMs = Math.floor(trackDuration * pct);
    seekToPosition(targetMs);
});
</script>

</body>
</html>
