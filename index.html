#th{font-size:.9rem;font-weight:600;line-height:1.4;text-align:center;color:rgba(255,255,255,.7);min-height:2.5em;display:flex;align-items:center}
#rd{display:flex;align-items:center;gap:16px}

#zr{position:absolute;left:33.33%;top:5px;bottom:5px;width:1px;background:rgba(255,255,255,.45);pointer-events:none}

#sl::-moz-range-track{height:2px;background:rgba(255,255,255,.28);border-radius:2px}
#sl::-webkit-slider-thumb{-webkit-appearance:none;width:4px;height:26px;margin-top:-12px;border-radius:3px;background:#fff;box-shadow:0 0 14px rgba(255,255,255,.8)}
#sl::-moz-range-thumb{width:4px;height:26px;border:0;border-radius:3px;background:#fff;box-shadow:0 0 14px rgba(255,255,255,.8)}

#tune button{font:inherit;font-weight:600;font-size:.9rem;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:8px 15px;border-radius:999px;cursor:pointer;touch-action:manipulation;transition:background .25s,transform .2s,opacity .25s}

@media(max-width:800px){
#app,body.solo #app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);align-items:start}
body.solo #app{grid-template-rows:1fr 0fr;align-items:center}
#side{padding-top:6vh}
#art{width:min(46vw,30vh)}
#ttl{max-width:80vw}
body.solo #art{width:min(72vw,50vh)}
#lyr{height:100%;min-height:0}
.l{font-size:clamp(1.35rem,6vw,2rem);padding:.4em 6vw .4em 13vw}
#cd{left:2.5vw}
#tune{bottom:calc(env(safe-area-inset-bottom,0px) + 2vh);gap:10px;padding:16px 16px 12px;border-radius:22px}

}
</style>

<body data-s="boot">
<div id="bg"><i></i><i></i><i></i></div>
<div id="login"><h2>isawavision</h2><button id="go">Connect Spotify</button></div>
<div id="start"><h2>isawavision</h2><button id="st">Start</button></div>
<div id="wait"><b></b><span>Waiting for music</span></div>
<div id="ready"><h2>Ready when you are</h2><p>Type the lyrics as they play. Stop, and the song waits for you.</p><button id="rs">Resume</button></div>
<main id="app">
<section id="side"><img id="art" alt=""><h1 id="ttl"></h1><p id="sub"></p></section>
<section id="lyr"><div id="box"></div></section>
</main>
<div id="tune">
<p id="th"></p>
<div id="rd"><i id="pd"></i><b id="ov">0</b><span>ms</span></div>
<div id="gw"><div id="zr"></div><input id="sl" type="range" min="-500" max="1000" step="5" value="0" aria-label="Timing offset"></div>
<div id="nu"><button data-n="-25">−25</button><button data-n="-5">−5</button><button data-n="5">+5</button><button data-n="25">+25</button></div>
<div id="ac"><button id="pp">Pause</button><button id="tp">space</button><button id="lk" disabled>Lock in</button></div>
<button id="sk">Skip for now</button>
</div>
<button id="tb" aria-label="Tune timing"><svg viewBox="0 0 24 24"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg></button>
<button id="fs" aria-label="Toggle fullscreen"><svg class="e" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><svg class="x" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
<input id="kb" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-hidden="true" tabindex="-1">
<div id="note"></div>
<script>
const CID='ff5af985ee254039b6d172039edeea90';
const REDIRECT=location.origin+location.pathname;
const SCOPE='streaming user-read-email user-read-private user-read-playback-state user-read-currently-playing user-modify-playback-state';
const LEAD=.15,REACT=.12;
const K='iwv';
const $=id=>document.getElementById(id);
const art=$('art'),ttl=$('ttl'),sub=$('sub'),box=$('box'),lyr=$('lyr'),kb=$('kb'),fsb=$('fs'),nt=$('note');
const tune=$('tune'),sl=$('sl'),ov=$('ov'),pd=$('pd'),th=$('th'),tp=$('tp'),pp=$('pp'),lk=$('lk'),sk=$('sk'),tb=$('tb');
let cur=null,seq=0,timer=0,lines=[],els=[],act=-2;
let anchor={pos:0,at:0,playing:false};
let fx=[],ft=[],fl=[],fo=[],fw=[],ws=[],refs=[],total=0,ptr=0,tl=-1;
let armed=false,ready=false,locked=false,hold=false,sent='pause',busy=false,last=0,lead=.35,pq=null,cmdv=0,polling=false,nxt=0;
let cdN=-1,cdOn=false,cdV=-1,nto=0,wt=0,prev='';
let off=0,tuned=false,tuning=false,manual=false,taps=[],prevOff=0,fi=-1;
let eng='api',sp=null,dev=null,gapMs=450,settle=900,lastPeek=0;

const sdkReady=new Promise(r=>{window.onSpotifyWebPlaybackSDKReady=r});
(()=>{
const s=document.createElement('script');
s.src='https://sdk.scdn.co/spotify-player.js';
s.async=true;
document.head.appendChild(s);
})();

const cd=document.createElement('div');
cd.id='cd';
cd.innerHTML='<svg viewBox="0 0 36 36"><circle class="tr" cx="18" cy="18" r="16"/><circle class="pg" cx="18" cy="18" r="16"/></svg><b></b>';
const ring=cd.querySelector('.pg'),cdb=cd.querySelector('b');

const FM={ß:'ss',ø:'o',æ:'ae',œ:'oe',ł:'l',đ:'d',ı:'i',þ:'th',ð:'d'};
const fold=s=>s.toLowerCase().replace(/[ßøæœłđıþð]/g,m=>FM[m]).normalize('NFD').replace(/[^a-z]/g,'');
const syl=f=>{let n=(f.match(/[aeiouy]+/g)||[]).length;if(n>1&&/[^aeiouy]e$/.test(f))n--;return Math.max(1,n)};
const clamp=(v,a,z)=>Math.min(z,Math.max(a,v));
const med=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const setState=s=>{document.body.dataset.s=s};
const store=()=>JSON.parse(localStorage.getItem(K)||'null');
const pos=()=>anchor.playing?anchor.pos+performance.now()-anchor.at:anchor.pos;
const eff=()=>pos()/1000-off;
const gate=()=>ptr<total?ws[fw[ptr]]:Infinity;

const saved=parseFloat(localStorage.getItem(K+'o'));
if(isFinite(saved)){off=clamp(saved,-.5,1);tuned=true}

function note(s){
nt.textContent=s;
nt.classList.add('v');
clearTimeout(nto);
nto=setTimeout(()=>nt.classList.remove('v'),6000);
}

const kick=ms=>{
if(polling){nxt=ms}
else{clearTimeout(timer);timer=setTimeout(poll,ms)}
};

async function tokenReq(body){
const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)});
if(!r.ok)throw 0;
const j=await r.json();
const s={a:j.access_token,r:j.refresh_token||(store()||{}).r,e:Date.now()+j.expires_in*1000-30000};
localStorage.setItem(K,JSON.stringify(s));
localStorage.setItem(K+'c',SCOPE);
return s;
}

async function token(){
let s=store();
if(!s||localStorage.getItem(K+'c')!==SCOPE)return null;
if(Date.now()>s.e){
try{s=await tokenReq({grant_type:'refresh_token',refresh_token:s.r,client_id:CID})}
catch{localStorage.removeItem(K);return null}
}
return s.a;
}

async function login(){
const chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
const v=[...crypto.getRandomValues(new Uint8Array(64))].map(n=>chars[n%62]).join('');
localStorage.setItem(K+'v',v);
const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
const c=btoa(String.fromCharCode(...new Uint8Array(h))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:CID,response_type:'code',redirect_uri:REDIRECT,scope:SCOPE,code_challenge_method:'S256',code_challenge:c});
}

async function api(path,opt={}){
const t=await token();
if(!t){clearTimeout(timer);setState('login');throw 0}
return fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+t,...(opt.headers||{})}});
}

async function peek(){
try{
const r=await api('/me/player');
if(r.status===200)return await r.json();
}catch{}
return null;
}

async function transfer(){
try{
await api('/me/player',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_ids:[dev],play:false})});
}catch{}
}

async function initEngine(){
try{
await Promise.race([sdkReady,new Promise((_,j)=>setTimeout(j,6000))]);
return await new Promise(res=>{
const to=setTimeout(()=>res(false),9000);
const end=v=>{clearTimeout(to);res(v)};
sp=new Spotify.Player({name:'isawavision',getOAuthToken:cb=>{token().then(t=>cb(t||''))}});
sp.addListener('ready',({device_id})=>{dev=device_id;end(true)});
['initialization_error','authentication_error','account_error'].forEach(n=>sp.addListener(n,()=>end(false)));
sp.addListener('autoplay_failed',()=>note('Click the page once to allow audio'));
sp.activateElement();
sp.connect().then(ok=>{if(!ok)end(false)}).catch(()=>end(false));
});
}catch{return false}
}

function idle(){
cur=null;
seq++;
anchor.playing=false;
sent='pause';
setState('wait');
document.title='isawavision';
}

function sync(pl,np){
const pr=pos();
if(Math.abs(np-pr)>1500)syncPtr(np/1000);
if(armed&&!pl&&sent==='play'&&want()==='play'&&performance.now()-last>1500)hold=true;
if(pl)hold=false;
sent=pl?'play':'pause';
if(!pl&&pq){
if(pq.p===ptr)lead=clamp(lead+(np/1000-pq.g)*.5,.04,.6);
pq=null;
}
if(pl&&anchor.playing){
const d=np-pr;
anchor=Math.abs(d)<300?{pos:pr+d*.3,at:performance.now(),playing:true}:{pos:np,at:performance.now(),playing:true};
}else{
anchor={pos:np,at:performance.now(),playing:pl};
}
}

function feed(it,p,np,v0){
setState(ready?'ready':'play');
setTrack(it);
pp.textContent=p?'Pause':'Play';
if(!busy&&(v0===undefined||v0===cmdv)&&performance.now()-last>settle)sync(p,np);
}

async function poll(){
if(eng==='sdk'||polling)return;
polling=true;
clearTimeout(timer);
let wait=2500;
const v0=cmdv;
try{
const t0=performance.now();
const r=await api('/me/player');
const t1=performance.now();
if(r.status===429){wait=(+r.headers.get('retry-after')||5)*1000}
else if(r.status===204||!r.ok){idle()}
else{
const j=await r.json();
if(!j.item||j.item.type!=='track'){idle()}
else{
const mid=t0+(t1-t0)/2;
const np=(j.progress_ms||0)+(j.is_playing?performance.now()-mid:0);

function hsl(r,g,b){
r/=255;g/=255;b/=255;
const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
let h=0,s=0;
if(d){
s=d/(1-Math.abs(2*l-1));
h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;
h=(h*60+360)%360;
}
return{h,s,l};
}

function colors(img){
const c=document.createElement('canvas');
c.width=c.height=48;
const x=c.getContext('2d',{willReadFrequently:true});
x.drawImage(img,0,0,48,48);
const d=x.getImageData(0,0,48,48).data;
const b={};
for(let i=0;i<d.length;i+=4){
if(d[i+3]<200)continue;
const k=(d[i]>>5)<<6|(d[i+1]>>5)<<3|(d[i+2]>>5);
const o=b[k]||(b[k]={n:0,r:0,g:0,b:0});
o.n++;o.r+=d[i];o.g+=d[i+1];o.b+=d[i+2];
}
const list=Object.values(b).map(o=>{
const v=hsl(o.r/o.n,o.g/o.n,o.b/o.n);
v.sc=o.n*(.15+v.s)*(v.l>.12&&v.l<.88?1:.3);
return v;
}).sort((p,q)=>q.sc-p.sc);
const p=list[0];
const hd=(a,z)=>Math.min(Math.abs(a-z),360-Math.abs(a-z));
const q=list.find(v=>hd(v.h,p.h)>35&&v.s>.15)||{h:(p.h+28)%360,s:p.s,l:p.l};
const cl=(v,a,z)=>Math.min(z,Math.max(a,v));
const sat=s=>s<.15?s:Math.max(s,.42);
const f=(h,s,l)=>`hsl(${Math.round(h)} ${Math.round(s*100)}% ${Math.round(l*100)}%)`;
const st=document.documentElement.style;
st.setProperty('--c1',f(p.h,cl(sat(p.s),0,.9),cl(p.l,.32,.5)));
st.setProperty('--c2',f(q.h,cl(sat(q.s),0,.9),cl(q.l,.26,.44)));
st.setProperty('--c3',f(p.h,Math.min(.5,p.s),.08));
}

function parse(t){
if(!t)return[];
const out=[];
let depth=0,carried=false;
for(const row of t.split('\n')){
const re=/\[(\d+):(\d+(?:\.\d+)?)\]/g;
const ts=[];
let m,end=0;
while((m=re.exec(row))){ts.push(+m[1]*60+ +m[2]);end=re.lastIndex}
if(!ts.length)continue;
const s=row.slice(end).replace(/<\d+:\d+(?:\.\d+)?>/g,'').replace(/\[[^\]]*\]/g,'').trim();
if(/^(作词|作曲|编曲|制作人|词|曲)\s*[:：]/.test(s))continue;
let main='',cu='';
const ad=[];
for(const ch of s){
if(ch==='('){depth++;continue}
if(ch===')'){
if(depth>0){depth--;if(!depth&&cu.trim()){ad.push(cu.trim());cu=''}}
continue;
}
if(depth>0)cu+=ch;else main+=ch;
}
if(cu.trim())ad.push(cu.trim());
if(depth>0){if(carried){depth=0;carried=false}else carried=true}else carried=false;
let mn=main.replace(/\s+/g,' ').replace(/\s+([,.!?;:])/g,'$1').trim();
if(!/[\p{L}\p{N}]/u.test(mn))mn='';
const a=ad.join(' · ').replace(/\s+/g,' ').trim();
ts.forEach(x=>out.push({t:x,m:mn,a}));
}
return out.sort((a,b)=>a.t-b.t);
}

function parseY(t){
if(!t)return[];
const out=[];
for(const row of t.split('\n')){
const h=/^\[(\d+),(\d+)\]/.exec(row);
if(!h)continue;
const body=row.slice(h[0].length);
const re=/\((\d+),(\d+),\d+\)/g;
const pts=[];
let m;
while((m=re.exec(body)))pts.push({s:+m[1]/1000,d:+m[2]/1000,i:m.index,e:re.lastIndex});
if(!pts.length)continue;
let depth=0,cu='',wd=null;
const ad=[],words=[];
pts.forEach((p,x)=>{
const chars=Array.from(body.slice(p.e,x+1<pts.length?pts[x+1].i:body.length));
chars.forEach((ch,q)=>{
if(ch==='('){depth++;wd=null;return}
if(ch===')'){
if(depth>0){depth--;if(!depth&&cu.trim()){ad.push(cu.trim());cu=''}}
wd=null;
return;
}
if(depth>0){cu+=ch;return}
if(/\s/.test(ch)){wd=null;return}
if(!wd){wd={t:p.s+p.d*q/chars.length,s:''};words.push(wd)}
wd.s+=ch;
});
});
if(cu.trim())ad.push(cu.trim());
const ok=words.filter(w=>/[\p{L}\p{N}]/u.test(w.s));
out.push({t:+h[1]/1000,m:ok.map(w=>w.s).join(' '),a:ad.join(' · '),wt:ok.map(w=>w.t)});
}
return out.filter(l=>l.m||l.a).sort((a,b)=>a.t-b.t);
}

function times(l,i,toks,ls){
if(l.wt&&l.wt.length===toks.length)return l.wt;
let nx=Infinity;
for(let j=i+1;j<ls.length;j++){
if(ls[j].t>l.t+.05){nx=ls[j].t;break}
}
const w=toks.map(tk=>{const f=fold(tk);return f?syl(f)+f.length*.15:0});
const tot=w.reduce((a,b)=>a+b,0)||1;
const est=tot*.2;
const gap=nx-l.t;
const dur=gap<=4?Math.max(.3,gap-.1):Math.min(gap-.1,Math.max(est*1.25,2));
let c=0;
return w.map(x=>{const t=l.t+dur*c/tot;c+=x;return t});
}

if(r.ok){
sent='play';
anchor={pos:pos(),at:performance.now()+200,playing:true};
kick(1000);
}
}
}catch{}
}
};

$('rs').onclick=()=>{
ready=false;
armed=true;
hold=false;
setState('play');
kb.focus({preventScroll:true});
drive();
};

$('st').onclick=async()=>{
setState('wait');
const ok=await initEngine();
if(ok){
eng='sdk';
gapMs=70;
settle=150;
lead=.14;
}else{
if(sp){try{sp.disconnect()}catch{}sp=null}
note('Precise playback is unavailable here, using standard mode');
}
begin();
};

const de=document.documentElement;
const fsOn=()=>document.fullscreenElement||document.webkitFullscreenElement;
if(!(de.requestFullscreen||de.webkitRequestFullscreen)){
fsb.remove();
tb.style.right='16px';
}else{
fsb.onmousedown=e=>e.preventDefault();
fsb.onclick=()=>{
if(fsOn()){
(document.exitFullscreen||document.webkitExitFullscreen).call(document);
}else{
const p=(de.requestFullscreen||de.webkitRequestFullscreen).call(de);
if(p&&p.catch)p.catch(()=>{});
}
fsb.blur();
};
}
['fullscreenchange','webkitfullscreenchange'].forEach(n=>document.addEventListener(n,()=>{
document.body.classList.toggle('fs',!!fsOn());
setTimeout(paint,120);
}));

const wake=()=>{
document.body.classList.remove('idle');
clearTimeout(wt);
wt=setTimeout(()=>document.body.classList.add('idle'),2600);
};
addEventListener('pointermove',wake);
addEventListener('pointerdown',wake);
wake();

addEventListener('resize',paint);
setInterval(drive,20);
$('go').onclick=login;
setOff(off);

(async()=>{
const p=new URLSearchParams(location.search);
if(p.get('code')){
try{
await tokenReq({grant_type:'authorization_code',code:p.get('code'),redirect_uri:REDIRECT,client_id:CID,code_verifier:localStorage.getItem(K+'v')});
}catch{}
history.replaceState(null,'',location.pathname);
}
if(await token()){
requestAnimationFrame(frame);
setState('start');
}else{
setState('login');
}
})();
</script>
