<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>isawavision</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
@property --c1{syntax:'<color>';inherits:true;initial-value:hsl(230 40% 30%)}
@property --c2{syntax:'<color>';inherits:true;initial-value:hsl(260 40% 26%)}
@property --c3{syntax:'<color>';inherits:true;initial-value:hsl(235 40% 8%)}
:root{transition:--c1 1.4s ease,--c2 1.4s ease,--c3 1.4s ease}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:var(--c3);-webkit-font-smoothing:antialiased}
body.idle[data-s=play]{cursor:none}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 30% 50%,transparent 20%,rgba(0,0,0,.45) 100%);pointer-events:none}
#bg{position:fixed;inset:0;z-index:-2;background:var(--c3);overflow:hidden}
#bg i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.75;animation:drift 28s ease-in-out infinite alternate}
#bg i:nth-child(1){background:var(--c1);left:-20vmax;top:-20vmax}
#bg i:nth-child(2){background:var(--c2);right:-25vmax;bottom:-25vmax;animation-duration:34s;animation-delay:-9s}
#bg i:nth-child(3){background:var(--c1);left:30vw;top:35vh;width:45vmax;height:45vmax;opacity:.4;animation-delay:-17s}
@keyframes drift{to{transform:translate(12vmax,8vmax) rotate(40deg) scale(1.15)}}
#app,#login,#wait,#ready{display:none}
body[data-s=play] #app,body[data-s=ready] #app{display:grid}
body[data-s=login] #login,body[data-s=wait] #wait,body[data-s=ready] #ready{display:flex}
#login,#wait,#ready{position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;padding:0 8vw;animation:rise .9s ease both}
#ready{z-index:3;gap:16px}
#login h2,#ready h2{font-size:clamp(1.8rem,5vw,3rem);font-weight:800;letter-spacing:-.04em}
#ready p{max-width:26em;font-size:clamp(.95rem,1.3vw,1.1rem);font-weight:600;line-height:1.5;color:rgba(255,255,255,.62)}
#login button,#ready button{font:inherit;font-weight:600;font-size:1rem;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:14px 32px;border-radius:999px;cursor:pointer;backdrop-filter:blur(12px);transition:background .25s,transform .25s}
#ready button{margin-top:12px}
#login button:hover,#ready button:hover{background:rgba(255,255,255,.24);transform:scale(1.04)}
#wait span{font-size:.95rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.55);animation:pulse 2.4s ease-in-out infinite}
#wait b{width:10px;height:10px;border-radius:50%;background:#fff;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
#app{height:100vh;height:100dvh;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);align-items:center;transition:grid-template-columns 1s cubic-bezier(.2,.8,.2,1),filter .9s ease,opacity .9s ease;animation:rise .9s ease both}
body[data-s=ready] #app{filter:blur(18px);opacity:.5;pointer-events:none}
body.solo #app{grid-template-columns:minmax(0,1fr) minmax(0,0fr)}
#side{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 3vw;gap:6px}
#art{width:min(30vw,52vh);aspect-ratio:1;object-fit:cover;border-radius:14px;background:rgba(255,255,255,.08);box-shadow:0 40px 90px -25px color-mix(in srgb,var(--c1) 75%,#000);transition:width 1s cubic-bezier(.2,.8,.2,1)}
#art.f{animation:rise .8s ease}
body.solo #art{width:min(80vw,58vh)}
#ttl{margin-top:22px;font-size:clamp(1rem,1.5vw,1.35rem);font-weight:800;letter-spacing:-.01em;max-width:min(30vw,52vh);transition:max-width 1s}
body.solo #ttl{max-width:min(80vw,58vh)}
#sub{font-size:clamp(.85rem,1.1vw,1rem);font-weight:600;color:rgba(255,255,255,.55)}
#lyr{height:100vh;height:100dvh;overflow:hidden;transition:opacity .8s;-webkit-mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent);mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent)}
body.solo #lyr{opacity:0;pointer-events:none}
#box{position:relative;transition:transform .75s cubic-bezier(.22,.85,.2,1);will-change:transform}
.l{position:relative;font-size:clamp(1.5rem,3vw,2.9rem);font-weight:800;line-height:1.18;letter-spacing:-.025em;padding:.42em 5vw .42em 4.4vw;cursor:pointer;transform-origin:left center;transform:scale(.94);opacity:max(.16,calc(.62 - var(--d,9) * .1));filter:blur(min(calc(var(--d,9) * .9px),5px));transition:opacity .55s,filter .55s,transform .55s cubic-bezier(.22,.85,.2,1)}
.l.g{letter-spacing:.2em}
.l.on{opacity:1;filter:none;transform:scale(1)}
.m{transition:text-shadow .55s}
.l.on .m{text-shadow:0 0 34px rgba(255,255,255,.35)}
.m span{transition:opacity .22s}
.t .m span:not(.d){opacity:.38}
.t .m span.n{box-shadow:0 .09em 0 0 rgba(255,255,255,.7);animation:caret 1.2s ease-in-out infinite}
@keyframes caret{50%{box-shadow:0 .09em 0 0 rgba(255,255,255,.1)}}
.a{display:flex;align-items:center;gap:.7em;margin-top:.4em;font-size:.44em;font-weight:600;line-height:1.3;letter-spacing:.03em;opacity:.6;text-shadow:none;transition:opacity .55s}
.a::before{content:"";flex:none;width:1.6em;height:1px;background:currentColor;opacity:.7}
.l.on .a{opacity:.78}
.l.o{padding-top:.05em;padding-bottom:.2em;opacity:max(.12,calc(.5 - var(--d,9) * .1))}
.l.o .a{margin-top:0;font-size:.5em}
.l.o.on{opacity:.9}
.l:hover{opacity:max(.7,calc(.62 - var(--d,9) * .1))}
#cd{position:absolute;left:.8vw;top:calc(1.01em - 15px);width:30px;height:30px;opacity:0;pointer-events:none;transition:opacity .25s}
#cd.v{opacity:1;transition-delay:.4s}
#cd svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
#cd circle{fill:none;stroke-width:2.4}
#cd .tr{stroke:rgba(255,255,255,.2)}
#cd .pg{stroke:#fff;stroke-linecap:round;stroke-dasharray:100.53;stroke-dashoffset:100.53}
#cd b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;letter-spacing:0;text-shadow:none}
#fs{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;z-index:5;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);cursor:pointer;opacity:.7;transition:opacity .4s,background .25s,transform .25s}
#fs:hover{opacity:1;background:rgba(255,255,255,.18);transform:scale(1.06)}
#fs svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#fs .x{display:none}
body.fs #fs .e{display:none}
body.fs #fs .x{display:block}
body[data-s=boot] #fs{display:none}
body.idle #fs{opacity:0;pointer-events:none}
#kb{position:fixed;left:-200px;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;pointer-events:none}
#note{position:fixed;left:50%;bottom:4vh;z-index:6;transform:translate(-50%,8px);padding:10px 18px;border-radius:999px;background:rgba(0,0,0,.4);backdrop-filter:blur(12px);font-size:.85rem;font-weight:600;color:rgba(255,255,255,.85);opacity:0;pointer-events:none;transition:opacity .4s,transform .4s}
#note.v{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){
#app,body.solo #app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);align-items:start}
body.solo #app{grid-template-rows:1fr 0fr;align-items:center}
#side{padding-top:6vh}
#art{width:min(46vw,30vh)}
#ttl{max-width:80vw}
body.solo #art{width:min(72vw,50vh)}
#lyr{height:100%;min-height:0}
.l{font-size:clamp(1.35rem,6vw,2rem);padding:.4em 6vw .4em 13vw}
#cd{left:2.5vw}
}
</style>
</head>
<body data-s="boot">
<div id="bg"><i></i><i></i><i></i></div>
<div id="login"><h2>isawavision</h2><button id="go">Connect Spotify</button></div>
<div id="wait"><b></b><span>Waiting for music</span></div>
<div id="ready"><h2>Ready when you are</h2><p>Type the lyrics as they play. Stop, and the song waits for you.</p><button id="rs">Resume</button></div>
<main id="app">
<section id="side"><img id="art" alt=""><h1 id="ttl"></h1><p id="sub"></p></section>
<section id="lyr"><div id="box"></div></section>
</main>
<button id="fs" aria-label="Toggle fullscreen"><svg class="e" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><svg class="x" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
<input id="kb" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-hidden="true" tabindex="-1">
<div id="note"></div>
<script>
const CID='ff5af985ee254039b6d172039edeea90';
const REDIRECT=location.origin+location.pathname;
const SCOPE='user-read-playback-state user-read-currently-playing user-modify-playback-state';
const LEAD=.15,LOOK=4,GAP=450,SETTLE=900;
const K='iwv';
const $=id=>document.getElementById(id);
const art=$('art'),ttl=$('ttl'),sub=$('sub'),box=$('box'),lyr=$('lyr'),kb=$('kb'),fsb=$('fs'),nt=$('note');
let cur=null,seq=0,timer=0,lines=[],els=[],act=-2;
let anchor={pos:0,at:0,playing:false};
let fx=[],ft=[],fl=[],fo=[],total=0,ptr=0,tl=-1;
let armed=false,ready=false,locked=false,hold=false,sent='pause',busy=false,last=0,lead=.35,pq=null,cmdv=0,polling=false,nxt=0;
let cdN=-1,cdOn=false,cdV=-1,nto=0,wt=0,prev='';

const cd=document.createElement('div');
cd.id='cd';
cd.innerHTML='<svg viewBox="0 0 36 36"><circle class="tr" cx="18" cy="18" r="16"/><circle class="pg" cx="18" cy="18" r="16"/></svg><b></b>';
const ring=cd.querySelector('.pg'),cdb=cd.querySelector('b');

const FM={ß:'ss',ø:'o',æ:'ae',œ:'oe',ł:'l',đ:'d',ı:'i',þ:'th',ð:'d'};
const fold=s=>s.toLowerCase().replace(/[ßøæœłđıþð]/g,m=>FM[m]).normalize('NFD').replace(/[^a-z]/g,'');
const clamp=(v,a,z)=>Math.min(z,Math.max(a,v));
const setState=s=>{document.body.dataset.s=s};
const store=()=>JSON.parse(localStorage.getItem(K)||'null');
const pos=()=>anchor.playing?anchor.pos+performance.now()-anchor.at:anchor.pos;
const gate=()=>ptr<total?ft[Math.min(ptr+LOOK,total-1)]:Infinity;

function note(s){
nt.textContent=s;
nt.classList.add('v');
clearTimeout(nto);
nto=setTimeout(()=>nt.classList.remove('v'),6000);
}

const kick=ms=>{
if(polling){nxt=ms}
else{clearTimeout(timer);timer=setTimeout(poll,ms)}
};

async function tokenReq(body){
const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)});
if(!r.ok)throw 0;
const j=await r.json();
const s={a:j.access_token,r:j.refresh_token||(store()||{}).r,e:Date.now()+j.expires_in*1000-30000};
localStorage.setItem(K,JSON.stringify(s));
return s;
}

async function token(){
let s=store();
if(!s)return null;
if(Date.now()>s.e){
try{s=await tokenReq({grant_type:'refresh_token',refresh_token:s.r,client_id:CID})}
catch{localStorage.removeItem(K);return null}
}
return s.a;
}

async function login(){
const chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
const v=[...crypto.getRandomValues(new Uint8Array(64))].map(n=>chars[n%62]).join('');
localStorage.setItem(K+'v',v);
const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
const c=btoa(String.fromCharCode(...new Uint8Array(h))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:CID,response_type:'code',redirect_uri:REDIRECT,scope:SCOPE,code_challenge_method:'S256',code_challenge:c});
}

async function api(path,opt={}){
const t=await token();
if(!t){clearTimeout(timer);setState('login');throw 0}
return fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+t}});
}

function idle(){
cur=null;
seq++;
anchor.playing=false;
sent='pause';
setState('wait');
document.title='isawavision';
}

function sync(pl,np){
const pr=pos();
if(Math.abs(np-pr)>1500)syncPtr(np/1000);
if(armed&&!pl&&sent==='play'&&want()==='play'&&performance.now()-last>1500)hold=true;
if(pl)hold=false;
sent=pl?'play':'pause';
if(!pl&&pq){
if(pq.p===ptr)lead=clamp(lead+(np/1000-pq.g)*.5,.08,.9);
pq=null;
}
if(pl&&anchor.playing){
const d=np-pr;
anchor=Math.abs(d)<300?{pos:pr+d*.3,at:performance.now(),playing:true}:{pos:np,at:performance.now(),playing:true};
}else{
anchor={pos:np,at:performance.now(),playing:pl};
}
}

async function poll(){
if(polling)return;
polling=true;
clearTimeout(timer);
let wait=2500;
const v0=cmdv;
try{
const t0=performance.now();
const r=await api('/me/player');
const t1=performance.now();
if(r.status===429){wait=(+r.headers.get('retry-after')||5)*1000}
else if(r.status===204||!r.ok){idle()}
else{
const j=await r.json();
if(!j.item||j.item.type!=='track'){idle()}
else{
setState(ready?'ready':'play');
setTrack(j.item);
const mid=t0+(t1-t0)/2;
const np=(j.progress_ms||0)+(j.is_playing?performance.now()-mid:0);
if(!busy&&v0===cmdv&&performance.now()-last>SETTLE)sync(j.is_playing,np);
if(j.is_playing)wait=Math.min(2000,Math.max(250,j.item.duration_ms-np+250));
}
}
}catch{}
polling=false;
timer=setTimeout(poll,nxt?Math.min(nxt,wait):wait);
nxt=0;
}

function want(){
if(!armed||hold||!cur)return null;
if(!total)return'play';
const g=gate()-pos()/1000;
return g>(sent==='play'?lead:Math.max(.9,lead+.45))?'play':'pause';
}

async function drive(){
if(busy)return;
const w=want();
if(!w||w===sent)return;
if(performance.now()-last<GAP)return;
busy=true;
cmdv++;
const g=gate(),pp=ptr;
let rate=0;
try{
const r=await api(w==='play'?'/me/player/play':'/me/player/pause',{method:'PUT'});
const t1=performance.now();
if(r.ok){
sent=w;
const p=anchor.playing?anchor.pos+t1-anchor.at:anchor.pos;
anchor={pos:p,at:w==='play'?t1+200:t1,playing:w==='play'};
pq=w==='pause'?{g,p:pp}:null;
kick(1000);
}else if(r.status===429){
rate=1;
last=performance.now()+(+r.headers.get('retry-after')||3)*1000;
}else if(r.status===403){
const e=await r.json().catch(()=>null);
if(e&&e.error&&e.error.reason==='PREMIUM_REQUIRED'){armed=false;note('Playback control needs Spotify Premium')}
else sent=w;
}else{
rate=1;
last=performance.now()+2500;
}
}catch{}
busy=false;
if(!rate)last=performance.now();
}

async function begin(){
setState('wait');
let j=null;
try{
const r=await api('/me/player');
if(r.status===200)j=await r.json();
}catch{}
if(j&&j.item&&j.item.type==='track'){
if(j.is_playing){
try{
const r=await api('/me/player/pause',{method:'PUT'});
if(r.status===403){
const e=await r.json().catch(()=>null);
if(e&&e.error&&e.error.reason==='PREMIUM_REQUIRED')locked=true;
}
}catch{}
last=performance.now();
cmdv++;
}
if(locked){note('Type-along mode needs Spotify Premium')}
else{ready=true;sent='pause'}
if(!locked&&j.is_playing)await new Promise(r=>setTimeout(r,1000));
}else{
armed=true;
}
poll();
}

function setTrack(it){
const id=it.id||it.uri;
if(id===cur)return;
cur=id;
const my=++seq;
ttl.textContent=it.name;
sub.textContent=it.artists.map(a=>a.name).join(', ');
document.title=it.name+' · '+it.artists[0].name;
lines=[];els=[];act=-2;box.innerHTML='';
fx=[];ft=[];fl=[];fo=[];total=0;ptr=0;tl=-1;hold=false;pq=null;cdN=-1;cdOn=false;
const im=it.album.images[0];
if(im)cover(im.url,my);
lyrics({name:it.name,clean:clean(it.name),artist:it.artists[0].name,album:it.album.name,dur:it.duration_ms/1000},my);
}

const clean=n=>n.replace(/\s*[\(\[].*?[\)\]]/g,'').replace(/\s+-\s+.*$/,'').trim();

function cover(u,my){
const i=new Image();
i.crossOrigin='anonymous';
i.onload=()=>{
if(my!==seq)return;
try{colors(i)}catch{}
art.src=u;
art.classList.remove('f');
void art.offsetWidth;
art.classList.add('f');
};
i.src=u;
}

function hsl(r,g,b){
r/=255;g/=255;b/=255;
const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
let h=0,s=0;
if(d){
s=d/(1-Math.abs(2*l-1));
h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;
h=(h*60+360)%360;
}
return{h,s,l};
}

function colors(img){
const c=document.createElement('canvas');
c.width=c.height=48;
const x=c.getContext('2d',{willReadFrequently:true});
x.drawImage(img,0,0,48,48);
const d=x.getImageData(0,0,48,48).data;
const b={};
for(let i=0;i<d.length;i+=4){
if(d[i+3]<200)continue;
const k=(d[i]>>5)<<6|(d[i+1]>>5)<<3|(d[i+2]>>5);
const o=b[k]||(b[k]={n:0,r:0,g:0,b:0});
o.n++;o.r+=d[i];o.g+=d[i+1];o.b+=d[i+2];
}
const list=Object.values(b).map(o=>{
const v=hsl(o.r/o.n,o.g/o.n,o.b/o.n);
v.sc=o.n*(.15+v.s)*(v.l>.12&&v.l<.88?1:.3);
return v;
}).sort((p,q)=>q.sc-p.sc);
const p=list[0];
const hd=(a,z)=>Math.min(Math.abs(a-z),360-Math.abs(a-z));
const q=list.find(v=>hd(v.h,p.h)>35&&v.s>.15)||{h:(p.h+28)%360,s:p.s,l:p.l};
const cl=(v,a,z)=>Math.min(z,Math.max(a,v));
const sat=s=>s<.15?s:Math.max(s,.42);
const f=(h,s,l)=>`hsl(${Math.round(h)} ${Math.round(s*100)}% ${Math.round(l*100)}%)`;
const st=document.documentElement.style;
st.setProperty('--c1',f(p.h,cl(sat(p.s),0,.9),cl(p.l,.32,.5)));
st.setProperty('--c2',f(q.h,cl(sat(q.s),0,.9),cl(q.l,.26,.44)));
st.setProperty('--c3',f(p.h,Math.min(.5,p.s),.08));
}

const J=async(u,proxy)=>{
const c=new AbortController();
const to=setTimeout(()=>c.abort(),8000);
try{
const r=await fetch(proxy?'https://api.allorigins.win/raw?url='+encodeURIComponent(u):u,{signal:c.signal});
if(!r.ok)return null;
return JSON.parse(await r.text());
}catch{return null}
finally{clearTimeout(to)}
};

const Q=o=>new URLSearchParams(o);
const near=(a,m)=>Math.abs(a-m.dur);

function pick(a,m){
if(!Array.isArray(a))return null;
const c=a.filter(x=>x.syncedLyrics&&near(x.duration,m)<=3).sort((x,y)=>near(x.duration,m)-near(y.duration,m));
return c[0]&&c[0].syncedLyrics;
}

const sources=[
async m=>{
const j=await J('https://lrclib.net/api/get?'+Q({track_name:m.name,artist_name:m.artist,album_name:m.album,duration:Math.round(m.dur)}));
return j&&j.syncedLyrics;
},
async m=>pick(await J('https://lrclib.net/api/search?'+Q({track_name:m.clean,artist_name:m.artist})),m),
async m=>pick(await J('https://lrclib.net/api/search?'+Q({q:m.clean+' '+m.artist})),m),
async m=>{
const s=await J('https://music.163.com/api/search/get?'+Q({s:m.clean+' '+m.artist,type:1,limit:8}),1);
const l=s&&s.result&&s.result.songs;
if(!l)return null;
const c=l.filter(x=>Math.abs(x.duration/1000-m.dur)<=3).sort((x,y)=>Math.abs(x.duration/1000-m.dur)-Math.abs(y.duration/1000-m.dur));
for(const x of c.slice(0,2)){
const y=await J('https://music.163.com/api/song/lyric?'+Q({id:x.id,lv:1,tv:-1}),1);
const t=y&&y.lrc&&y.lrc.lyric;
if(t&&/\[\d+:\d+/.test(t))return t;
}
return null;
}
];

function parse(t){
if(!t)return[];
const out=[];
let depth=0,carried=false;
for(const row of t.split('\n')){
const re=/\[(\d+):(\d+(?:\.\d+)?)\]/g;
const ts=[];
let m,end=0;
while((m=re.exec(row))){ts.push(+m[1]*60+ +m[2]);end=re.lastIndex}
if(!ts.length)continue;
const s=row.slice(end).replace(/<\d+:\d+(?:\.\d+)?>/g,'').replace(/\[[^\]]*\]/g,'').trim();
if(/^(作词|作曲|编曲|制作人|词|曲)\s*[:：]/.test(s))continue;
let main='',cu='';
const ad=[];
for(const ch of s){
if(ch==='('){depth++;continue}
if(ch===')'){
if(depth>0){depth--;if(!depth&&cu.trim()){ad.push(cu.trim());cu=''}}
continue;
}
if(depth>0)cu+=ch;else main+=ch;
}
if(cu.trim())ad.push(cu.trim());
if(depth>0){if(carried){depth=0;carried=false}else carried=true}else carried=false;
let mn=main.replace(/\s+/g,' ').replace(/\s+([,.!?;:])/g,'$1').trim();
if(!/[\p{L}\p{N}]/u.test(mn))mn='';
const a=ad.join(' · ').replace(/\s+/g,' ').trim();
ts.forEach(x=>out.push({t:x,m:mn,a}));
}
return out.sort((a,b)=>a.t-b.t);
}

async function lyrics(m,my){
const ps=sources.map(f=>f(m).catch(()=>null));
for(const p of ps){
const t=await p;
if(my!==seq)return;
const ls=parse(t);
if(ls.filter(l=>l.m||l.a).length>1){build(ls);return}
}
if(my===seq)build([]);
}

function build(ls){
lines=ls;
box.innerHTML='';
fx=[];ft=[];fl=[];fo=[];
cdN=-1;cdOn=false;tl=-1;
let letters=0,chars=0;
ls.forEach(l=>{
if(l.m){
letters+=fold(l.m).length;
chars+=(l.m.match(/\p{L}/gu)||[]).length;
}
});
const typed=letters>=20&&letters>=chars*.7;
els=ls.map((l,i)=>{
const d=document.createElement('div');
d.className='l'+(l.m?'':l.a?' o':' g');
if(l.m){
const m=document.createElement('div');
m.className='m';
if(typed){
const n=fold(l.m).length;
const gap=i+1<ls.length?ls[i+1].t-l.t:Infinity;
const span=Math.min(gap,Math.max(.8,n*.16));
const cs=[];
let k=0;
for(const ch of l.m){
const e=document.createElement('span');
e.textContent=ch;
for(const x of fold(ch)){
fx.push(x);
ft.push(l.t+k/n*span);
fl.push(i);
fo.push(k);
k++;
}
cs.push({e,n:k});
m.appendChild(e);
}
l.cs=cs;
}else{
m.textContent=l.m;
}
d.appendChild(m);
}
if(l.a){
const a=document.createElement('div');
a.className='a';
a.textContent=l.a;
d.appendChild(a);
}
if(!l.m&&!l.a)d.textContent='♪';
d.onclick=()=>seek(l.t);
box.appendChild(d);
return d;
});
total=fx.length;
act=-2;
document.body.classList.toggle('solo',!ls.length);
if(ls.length){syncPtr(pos()/1000);paint()}
}

function syncPtr(s){
let lo=0,hi=total;
while(lo<hi){
const m=(lo+hi)>>1;
if(ft[m]<s-.02)lo=m+1;else hi=m;
}
ptr=lo;
show();
}

function show(){
const pl=ptr<total?fl[ptr]:-1;
if(pl!==tl){
if(tl>=0&&els[tl])els[tl].classList.remove('t');
tl=pl;
if(pl>=0)els[pl].classList.add('t');
}
if(pl>=0){
const po=fo[ptr];
let f=false;
for(const c of lines[pl].cs){
const dn=po>=c.n;
c.e.classList.toggle('d',dn);
const nx=!dn&&!f;
c.e.classList.toggle('n',nx);
if(nx)f=true;
}
}
}

function type(ch){
if(!armed||!total||ptr>=total)return;
let ok=false;
for(const x of fold(ch)){
if(ptr<total&&fx[ptr]===x){ptr++;ok=true}else break;
}
if(ok){hold=false;show();drive()}
}

function seek(s){
last=performance.now();
cmdv++;
api('/me/player/seek?position_ms='+Math.round(s*1000),{method:'PUT'}).then(()=>{last=performance.now();kick(900)}).catch(()=>{});
anchor={pos:s*1000,at:performance.now(),playing:anchor.playing};
syncPtr(s);
}

function paint(){
if(!els.length)return;
const a=Math.max(act,0);
els.forEach((e,n)=>{
e.style.setProperty('--d',Math.abs(n-act));
e.classList.toggle('on',n===act);
});
const e=els[a];
box.style.transform=`translateY(${lyr.clientHeight/2-e.offsetTop-e.offsetHeight/2}px)`;
}

function find(t){
let lo=0,hi=lines.length-1,i=-1;
while(lo<=hi){
const m=(lo+hi)>>1;
if(lines[m].t<=t){i=m;lo=m+1}else hi=m-1;
}
return i;
}

function tick(t){
let n=-1,r=0;
if(armed&&total&&ptr<total&&fo[ptr]===0){n=fl[ptr];r=ft[ptr]-t}
if(n<0||r<=0||r>10){
if(cdOn){cd.classList.remove('v');cdOn=false}
return;
}
if(cdN!==n){els[n].appendChild(cd);cdN=n;cdV=-1}
if(!cdOn){cd.classList.add('v');cdOn=true}
const c=Math.ceil(r);
if(c!==cdV){cdb.textContent=c;cdV=c}
ring.style.strokeDashoffset=(100.53*(1-r/10)).toFixed(2);
}

function frame(){
if(lines.length){
const t=pos()/1000;
let i=find(t+LEAD);
if(total&&ptr<total&&fo[ptr]>0&&fl[ptr]<i)i=fl[ptr];
if(i!==act){act=i;paint()}
tick(t);
}
requestAnimationFrame(frame);
}

document.addEventListener('keydown',e=>{
if(document.body.dataset.s!=='play'||!e.key||e.ctrlKey||e.metaKey||e.altKey||e.isComposing||e.key.length!==1)return;
e.preventDefault();
type(e.key);
});

document.addEventListener('pointerdown',()=>{
if(document.body.dataset.s==='play'&&armed&&total)kb.focus({preventScroll:true});
});

kb.addEventListener('input',()=>{
const v=kb.value;
if(v.length>prev.length&&v.startsWith(prev))for(const ch of v.slice(prev.length))type(ch);
prev=v;
if(v.length>32){kb.value='';prev=''}
});

$('rs').onclick=()=>{
ready=false;
armed=true;
hold=false;
setState('play');
kb.focus({preventScroll:true});
drive();
};

const de=document.documentElement;
const fsOn=()=>document.fullscreenElement||document.webkitFullscreenElement;
if(!(de.requestFullscreen||de.webkitRequestFullscreen)){
fsb.remove();
}else{
fsb.onmousedown=e=>e.preventDefault();
fsb.onclick=()=>{
if(fsOn()){
(document.exitFullscreen||document.webkitExitFullscreen).call(document);
}else{
const p=(de.requestFullscreen||de.webkitRequestFullscreen).call(de);
if(p&&p.catch)p.catch(()=>{});
}
fsb.blur();
};
}
['fullscreenchange','webkitfullscreenchange'].forEach(n=>document.addEventListener(n,()=>{
document.body.classList.toggle('fs',!!fsOn());
setTimeout(paint,120);
}));

const wake=()=>{
document.body.classList.remove('idle');
clearTimeout(wt);
wt=setTimeout(()=>document.body.classList.add('idle'),2600);
};
addEventListener('pointermove',wake);
addEventListener('pointerdown',wake);
wake();

addEventListener('resize',paint);
setInterval(drive,100);
$('go').onclick=login;

(async()=>{
const p=new URLSearchParams(location.search);
if(p.get('code')){
try{
await tokenReq({grant_type:'authorization_code',code:p.get('code'),redirect_uri:REDIRECT,client_id:CID,code_verifier:localStorage.getItem(K+'v')});
}catch{}
history.replaceState(null,'',location.pathname);
}
if(await token()){
requestAnimationFrame(frame);
begin();
}else{
setState('login');
}
})();
