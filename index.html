<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070b">
<title>isawavision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--e:cubic-bezier(.22,1,.36,1);--v:1vh;--cw:min(33vw,calc(var(--v)*54))}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#07070b;color:#fff;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-user-select:none;user-select:none}
body.idle{cursor:none}
#bg,.shade,.grain{position:fixed;inset:0;pointer-events:none}
.bg{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity 1.8s ease}
.bg.in{opacity:1}
.bg b{position:absolute;width:95vmax;height:95vmax;border-radius:50%;background:radial-gradient(closest-side,var(--c),var(--z));opacity:.8;animation:drift 28s ease-in-out infinite alternate}
.bg b:nth-child(1){left:-35vmax;top:-35vmax}
.bg b:nth-child(2){right:-40vmax;top:0;animation-duration:34s;animation-delay:-11s}
.bg b:nth-child(3){left:5vmax;bottom:-55vmax;animation-duration:41s;animation-delay:-19s}
@keyframes drift{to{transform:translate3d(9vmax,7vmax,0) scale(1.2) rotate(40deg)}}
.shade{background:radial-gradient(130% 110% at 28% 46%,rgba(0,0,0,.12),rgba(0,0,0,.62)),rgba(0,0,0,.16)}
.grain{opacity:.08;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#stage{position:fixed;inset:0;transition:opacity 1s var(--e)}
[data-s=boot] #stage,[data-s=login] #stage,[data-s=idle] #stage{opacity:0;pointer-events:none}
#left{position:absolute;left:7vw;top:50%;width:var(--cw);display:flex;flex-direction:column;align-items:center;transform:translateY(-50%);transition:transform 1.1s var(--e),top 1.1s var(--e)}
.nl #left{transform:translate(calc(43vw - var(--cw)/2),-50%)}
.cov{position:relative;width:var(--cw);height:var(--cw);border-radius:calc(var(--cw)*.04);background:rgba(255,255,255,.06);box-shadow:0 calc(var(--cw)*.08) calc(var(--cw)*.22) calc(var(--cw)*-.06) rgba(0,0,0,.7),0 0 calc(var(--cw)*.35) calc(var(--cw)*-.1) var(--g,transparent);transition:box-shadow 1.4s ease}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;opacity:0;transform:scale(1.06);transition:opacity .7s var(--e),transform 1.1s var(--e)}
.cov img.in{opacity:1;transform:none}
.meta{width:100%;margin-top:calc(var(--cw)*.07);text-align:center}
.meta h1{font-size:max(14px,calc(var(--cw)*.062));font-weight:700;letter-spacing:-.01em;line-height:1.22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta p{margin-top:.35em;font-size:max(12px,calc(var(--cw)*.048));font-weight:600;color:rgba(255,255,255,.58);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#right{position:absolute;top:0;bottom:0;left:calc(13vw + var(--cw));right:5vw;overflow:hidden;transition:opacity .9s var(--e);-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 80%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 80%,transparent)}
.nl #right{opacity:0}
#lines{position:absolute;inset:0;font-size:min(3.5vw,calc(var(--v)*6.2));font-weight:700;letter-spacing:-.02em;line-height:1.17}
.ln{position:absolute;left:0;right:0;top:0;padding-right:.4em;opacity:0;transform-origin:0 50%;transition:transform 1s var(--e) var(--dl,0ms),opacity .6s ease,filter .6s ease}
.nt .ln{transition:none}
.t{display:inline}
.on .t{background-image:linear-gradient(90deg,#fff calc(var(--p,0)*1%),rgba(255,255,255,.42) calc(var(--p,0)*1% + 8%));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.a{display:block;margin-top:.3em;font-size:.5em;font-weight:600;letter-spacing:0;line-height:1.25;color:rgba(255,255,255,.6);transition:color .6s}
.on .a{color:rgba(255,255,255,.8)}
.ad .t{font-size:.56em;font-weight:600;letter-spacing:0}
.g i{display:inline-block;width:.46em;height:.46em;margin:.28em .34em .28em 0;border-radius:50%;background:#fff;opacity:calc(.28 + .72*min(1,max(0,(var(--p,0) - var(--k,0))/30)))}
.g i:nth-child(2){--k:30}
.g i:nth-child(3){--k:60}
.g.on i{animation:br 2.6s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.14)}}
.msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .9s var(--e),visibility 0s .9s}
[data-s=login] #login,[data-s=idle] #idle{opacity:1;visibility:visible;transition:opacity .9s var(--e) .25s,visibility 0s}
#login h2{font-size:min(11vw,calc(var(--v)*7));font-weight:600;letter-spacing:-.035em}
#go{margin-top:30px;padding:15px 32px;border-radius:99px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:background .3s,transform .3s var(--e)}
#go:hover{background:rgba(255,255,255,.2)}
#go:active{transform:scale(.96)}
.eq{display:flex;gap:5px;height:30px;align-items:center}
.eq i{width:3px;height:100%;border-radius:3px;background:#fff;transform:scaleY(.2);animation:eq 1.3s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.45s}
.eq i:nth-child(3){animation-delay:-.9s}
.eq i:nth-child(4){animation-delay:-.2s}
@keyframes eq{50%{transform:scaleY(1)}}
#idle p{margin-top:20px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.55)}
#fs{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);right:calc(env(safe-area-inset-right,0px) + 18px);width:42px;height:42px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;transition:opacity .5s,background .3s}
#fs[hidden]{display:none}
#fs:hover{background:rgba(255,255,255,.18)}
.idle #fs{opacity:0;pointer-events:none}
#fs svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#fs .c,.full #fs .x{display:none}
.full #fs .c{display:block}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);padding:9px 16px;border-radius:99px;background:rgba(0,0,0,.45);font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.s{opacity:1}
@media (max-aspect-ratio:1/1){
:root{--cw:min(58vw,calc(var(--v)*31))}
#left{left:50%;top:calc(env(safe-area-inset-top,0px) + var(--v)*5);transform:translate(-50%,0)}
.nl #left{top:50%;transform:translate(-50%,-50%)}
#right{left:7vw;right:7vw;top:calc(env(safe-area-inset-top,0px) + var(--v)*5 + var(--cw)*1.32)}
#lines{font-size:min(7vw,calc(var(--v)*3.6))}
}
</style>
</head>
<body data-s="boot">
<div id="bg"></div>
<div class="shade"></div>
<div class="grain"></div>
<main id="stage">
<section id="left">
<div class="cov" id="cov"></div>
<div class="meta" id="meta"><h1 id="ti"></h1><p id="ar"></p></div>
</section>
<section id="right"><div id="lines"></div></section>
</main>
<div class="msg" id="login"><h2>isawavision</h2><button id="go">Connect Spotify</button></div>
<div class="msg" id="idle"><div class="eq"><i></i><i></i><i></i><i></i></div><p>Waiting for music</p></div>
<button id="fs" aria-label="Fullscreen"><svg class="x" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg><svg class="c" viewBox="0 0 24 24"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg></button>
<div id="toast"></div>
<script>
const CID='ff5af985ee254039b6d172039edeea90',RU=location.origin+'/',SC='user-read-playback-state user-read-currently-playing';
const $=s=>document.querySelector(s),B=document.body,LS=localStorage,Q=encodeURIComponent;
const ti=$('#ti'),ar=$('#ar'),meta=$('#meta'),cov=$('#cov'),left=$('#left'),right=$('#right'),lines=$('#lines'),toast=$('#toast'),BG=$('#bg'),fs=$('#fs');
let gen=0,cur=null,base=0,baseT=0,playing=false,adj=LS.adj===undefined?150:+LS.adj;
let L=[],els=[],ys=[],hs=[],act=-2,pv=-1,busy=0,pt,rp,rz,tt;
const cache=new Map(),imgs=new Map();
const DEF=['hsl(228 62% 38%)','hsl(282 52% 34%)','hsl(190 60% 32%)'];
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const setVh=()=>document.documentElement.style.setProperty('--v',innerHeight/100+'px');
setVh();addEventListener('resize',setVh);

const rnd=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),x=>'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~'[x%66]).join('');
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function login(){
const v=rnd(96);LS.v=v;
const c=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:CID,response_type:'code',redirect_uri:RU,scope:SC,code_challenge_method:'S256',code_challenge:c});
}
async function tok(p){
const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CID,...p})});
if(!r.ok)throw r.status;
const j=await r.json();
LS.at=j.access_token;LS.exp=Date.now()+j.expires_in*1000-60000;
if(j.refresh_token)LS.rt=j.refresh_token;
}
const out=()=>{['at','exp','rt'].forEach(k=>LS.removeItem(k));B.dataset.s='login'};
async function auth(){
if(LS.at&&Date.now()<+LS.exp)return LS.at;
if(!LS.rt)return null;
rp=rp||tok({grant_type:'refresh_token',refresh_token:LS.rt}).finally(()=>rp=0);
try{await rp;return LS.at}catch(e){if(e===400||e===401)out();return null}
}
async function api(p,again){
const t=await auth();
if(!t)return{s:LS.rt?0:401};
try{
const r=await fetch('https://api.spotify.com/v1'+p,{headers:{Authorization:'Bearer '+t},cache:'no-store'});
if(r.status===204)return{s:204};
if(r.status===401&&!again){LS.exp=0;return api(p,1)}
if(r.status===429)return{s:429,w:+r.headers.get('Retry-After')||3};
return r.ok?{s:200,d:await r.json()}:{s:r.status};
}catch(e){return{s:0}}
}

const tone=(o,sh)=>{
const r=o.r/255,g=o.g/255,b=o.b/255,m=Math.max(r,g,b),n=Math.min(r,g,b),d=m-n,l=(m+n)/2;
let h=0,s=0;
if(d){s=d/(1-Math.abs(2*l-1));h=m===r?((g-b)/d+6)%6:m===g?(b-r)/d+2:(r-g)/d+4;h*=60}
const S=s<.1?s*100:clamp(s*100,42,88),Lg=clamp(l*100,26,48);
return`hsl(${Math.round(h+sh)%360} ${Math.round(S)}% ${Math.round(Lg)}%)`;
};
function pal(i){
try{
const c=document.createElement('canvas');c.width=c.height=28;
const x=c.getContext('2d');x.drawImage(i,0,0,28,28);
const d=x.getImageData(0,0,28,28).data,k={};
for(let j=0;j<d.length;j+=4){
const id=(d[j]>>4)<<8|(d[j+1]>>4)<<4|d[j+2]>>4,o=k[id]||(k[id]={n:0,r:0,g:0,b:0});
o.n++;o.r+=d[j];o.g+=d[j+1];o.b+=d[j+2];
}
const all=Object.values(k).map(o=>{
const r=o.r/o.n,g=o.g/o.n,b=o.b/o.n,m=Math.max(r,g,b),n=Math.min(r,g,b);
return{r,g,b,w:o.n*(.2+(m-n)/255*2)*(m>35?1:.2)};
}).sort((a,b)=>b.w-a.w);
const pick=[];
for(const o of all){
if(pick.every(p=>Math.hypot(p.r-o.r,p.g-o.g,p.b-o.b)>70))pick.push(o);
if(pick.length===3)break;
}
while(pick.length<3)pick.push(pick[pick.length-1]||{r:60,g:70,b:140});
return pick.map((o,i)=>tone(o,pick.indexOf(o)<i?i*28:0));
}catch(e){return DEF}
}
const loadImg=u=>new Promise(r=>{
const i=new Image();i.crossOrigin='anonymous';
i.onload=()=>r(i);
i.onerror=()=>{const j=new Image();j.onload=()=>r(j);j.onerror=()=>r(null);j.src=u};
i.src=u;
});
const art=u=>{
if(!u)return Promise.resolve({i:null,c:DEF});
let p=imgs.get(u);
if(!p){p=loadImg(u).then(i=>({i,c:i?pal(i):DEF}));imgs.set(u,p);if(imgs.size>60)imgs.delete(imgs.keys().next().value)}
return p;
};
function bg(c){
const e=document.createElement('div');e.className='bg';
e.style.background=c[0].replace(/\d+%\)$/,'9%)');
e.innerHTML=c.map(x=>`<b style="--c:${x};--z:${x.replace(')',' / 0)')}"></b>`).join('');
BG.append(e);
requestAnimationFrame(()=>requestAnimationFrame(()=>e.classList.add('in')));
while(BG.children.length>4)BG.firstChild.remove();
}

const jf=async(u,ms=8000)=>{
const c=new AbortController(),k=setTimeout(()=>c.abort(),ms);
try{const r=await fetch(u,{signal:c.signal});return r.ok?await r.json():null}catch(e){return null}finally{clearTimeout(k)}
};
const nz=s=>(s||'').toLowerCase().replace(/\(.*?\)|\[.*?\]|\s-\s.*$/g,' ').replace(/[^a-z0-9\u00c0-\uffff]+/g,' ').trim();
const clean=s=>s.replace(/\s*[\(\[]\s*(feat|ft|with|prod)\b.*?[\)\]]/ig,'').replace(/\s-\s.*(remaster|version|edit|mono|stereo|live|deluxe|radio).*$/i,'').trim();
const LR='https://lrclib.net/api/';
const rec=r=>r&&(r.instrumental?{i:1}:(r.syncedLyrics||r.plainLyrics)?{s:r.syncedLyrics,p:r.plainLyrics}:null);
const get=t=>jf(LR+`get?track_name=${Q(clean(t.name))}&artist_name=${Q(t.artists[0])}&album_name=${Q(t.album)}&duration=${Math.round(t.dur/1000)}`).then(rec);
const search=async t=>{
const n=clean(t.name),a=t.artists[0];
const rs=await Promise.all([jf(LR+`search?track_name=${Q(n)}&artist_name=${Q(a)}`),jf(LR+`search?q=${Q(n+' '+a)}`),jf(LR+`search?q=${Q(n)}`)]);
const d=t.dur/1000,k=nz(t.name);let best=null,bs=-1e9;
rs.flat().forEach(r=>{
if(!r||!(r.syncedLyrics||r.plainLyrics))return;
const dd=Math.abs(r.duration-d),m=nz(r.trackName);
if(dd>6||!(m===k||m.includes(k)||k.includes(m)))return;
const s=(r.syncedLyrics?100:0)-dd*3+(nz(r.artistName)===nz(a)?30:0);
if(s>bs){bs=s;best=r}
});
return rec(best);
};
const ovh=t=>jf(`https://api.lyrics.ovh/v1/${Q(t.artists[0])}/${Q(clean(t.name))}`,9000).then(r=>r&&r.lyrics&&r.lyrics.trim().length>40?{p:r.lyrics}:null);

const parse=s=>{
const o=[];
for(const l of s.split('\n')){
const m=l.match(/^((?:\[\d+:\d+(?:[.:]\d+)?\])+)(.*)$/);
if(!m)continue;
const x=m[2].trim();
for(const q of m[1].matchAll(/\[(\d+):(\d+)(?:[.:](\d+))?\]/g))o.push({t:(q[1]*60+ +q[2])*1000+ +((q[3]||'0')+'00').slice(0,3),x});
}
return o.sort((a,b)=>a.t-b.t);
};
const plain=(p,d)=>{
const ls=p.split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!/^\[.*\]$/.test(x));
const w=ls.map(x=>x.length+14),sum=w.reduce((a,b)=>a+b,0);let c=0;
return ls.map((x,i)=>{const t=d*.06+d*.88*c/sum;c+=w[i];return{t,x}});
};
const sp=x=>{
const a=[];
const m=x.replace(/\(([^)]*)\)/g,(_,v)=>{v=v.trim();if(v)a.push(v);return' '}).replace(/\s+/g,' ').trim();
return{m,a:a.join(' · ')};
};
function build(raw,est){
const o=[];
raw.forEach((r,i)=>{
if(!r.x||/^\[.*\]$/.test(r.x))return;
const s=sp(r.x);if(!s.m&&!s.a)return;
const n=raw[i+1];
let e=n?n.t:r.t+4000;
if(!est&&n&&n.x)e=Math.min(e,r.t+Math.max(1400,r.x.length*110));
o.push({t:r.t,e:Math.max(e,r.t+300),m:s.m,a:s.a});
});
const res=[];
if(!est&&o.length&&o[0].t>5000)res.push({g:1,t:0,e:o[0].t});
o.forEach((l,i)=>{
res.push(l);
const n=o[i+1];
if(!est&&n&&n.t-l.e>5500)res.push({g:1,t:l.e,e:n.t});
});
return res;
}
const pack=(r,t)=>{
const L=build(r.s?parse(r.s):plain(r.p,t.dur/1000*1000),!r.s);
return L.length?{L}:null;
};
async function load(t){
if(t.ep)return null;
const pg=get(t),ps=search(t),po=ovh(t);
const g=await pg;
if(g&&g.s)return pack(g,t);
const s=await ps;
if(s&&s.s)return pack(s,t);
const p=[g,s].find(x=>x&&x.p)||await po;
return p&&p.p?pack(p,t):null;
}
function entry(t){
let e=cache.get(t.id);
if(!e){
e={v:undefined};
e.p=load(t).then(v=>e.v=v||null,()=>e.v=null);
cache.set(t.id,e);
e.p.then(()=>{if(!e.v)setTimeout(()=>cache.get(t.id)===e&&cache.delete(t.id),20000)});
if(cache.size>80)cache.delete(cache.keys().next().value);
}
return e;
}

const pos=()=>base+(playing?performance.now()-baseT:0);
const find=p=>{let lo=0,hi=L.length-1,r=-1;while(lo<=hi){const m=lo+hi>>1;if(L[m].t<=p){r=m;lo=m+1}else hi=m-1}return r};
const row=l=>l.g?'<div class="ln g"><i></i><i></i><i></i></div>':`<div class="ln${l.m?'':' ad'}"><span class="t">${esc(l.m||l.a)}</span>${l.m&&l.a?`<span class="a">${esc(l.a)}</span>`:''}</div>`;
function measure(){
const gp=parseFloat(getComputedStyle(lines).fontSize)*.62;let y=0;
ys=[];hs=[];
els.forEach(e=>{const h=e.offsetHeight;ys.push(y);hs.push(h);y+=h+gp});
}
function setAct(i){
const prev=act,a=Math.max(i,0),top=right.clientHeight*.37-hs[a]/2;
act=i;pv=-1;
els.forEach((e,j)=>{
const d=j-i,n=Math.abs(d),on=d===0;
e.classList.toggle('on',on);
e.style.setProperty('--dl',(d>0&&i>prev?Math.min(d*45,380):0)+'ms');
e.style.opacity=on?1:n>7?0:Math.max(.1,.42-.055*(n-1));
e.style.filter=`blur(${on?0:Math.min(n*1.1,5.5)}px) drop-shadow(0 0 ${on?22:0}px rgba(255,255,255,${on?.3:0}))`;
e.style.transform=`translate3d(0,${top+ys[j]-ys[a]}px,0) scale(${on?1:.92})`;
});
if(els[i])els[i].style.setProperty('--p',0);
}
function relayout(){
cancelAnimationFrame(rz);
rz=requestAnimationFrame(()=>{
if(!els.length)return;
measure();lines.classList.add('nt');setAct(act);void lines.offsetWidth;lines.classList.remove('nt');
});
}
const clearLyrics=()=>{L=[];els=[];ys=[];hs=[];act=-2;lines.textContent=''};
function show(v){
clearLyrics();
if(!v||!v.L.length){B.classList.add('nl');return}
B.classList.remove('nl');
L=v.L;
lines.innerHTML=L.map(row).join('');
els=[...lines.children];
lines.classList.add('nt');
measure();
setAct(find(pos()+adj));
void lines.offsetWidth;
lines.classList.remove('nt');
lines.animate([{opacity:0},{opacity:1}],{duration:700,easing:'ease-out'});
}
function frame(){
requestAnimationFrame(frame);
if(!L.length)return;
const p=pos()+adj,i=find(p);
if(i!==act)setAct(i);
if(i>=0){
const l=L[i],v=clamp((p-l.t)/(l.e-l.t)*100,0,100);
if(Math.abs(v-pv)>.2||v===100&&pv!==100){els[i].style.setProperty('--p',v.toFixed(1));pv=v}
}
}

const nt=i=>{
const im=(i.album||i).images||[];
return{id:i.id||i.uri,name:i.name,artists:(i.artists||[{name:i.show?i.show.name:''}]).map(a=>a.name),album:i.album?i.album.name:'',dur:i.duration_ms,ep:i.type!=='track',cover:im[0]?im[0].url:null};
};
function setTrack(t){
const g=++gen;
ti.textContent=t.name;ar.textContent=t.artists.join(', ');
document.title=t.name+' · '+t.artists[0];
meta.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:600,easing:'cubic-bezier(.22,1,.36,1)'});
art(t.cover).then(a=>{
if(g!==gen)return;
bg(a.c);left.style.setProperty('--g',a.c[0]);
if(!a.i){cov.textContent='';return}
const n=a.i.cloneNode();n.alt='';n.draggable=false;
(n.decode?n.decode():Promise.resolve()).catch(()=>0).then(()=>{
if(g!==gen)return;
cov.append(n);
requestAnimationFrame(()=>n.classList.add('in'));
while(cov.children.length>2)cov.firstChild.remove();
});
});
clearLyrics();
const e=entry(t);
e.v!==undefined?show(e.v):e.p.then(()=>g===gen&&show(e.v));
setTimeout(async()=>{
if(g!==gen)return;
const r=await api('/me/player/queue');
if(g!==gen||r.s!==200)return;
(r.d.queue||[]).slice(0,2).forEach(q=>{if(q.type==='track'){const n=nt(q);entry(n);art(n.cover)}});
},350);
}
async function poll(){
if(busy)return;
busy=1;clearTimeout(pt);
let w=900;
const a=performance.now(),r=await api('/me/player/currently-playing?additional_types=episode'),b=performance.now();
if(r.s===401){busy=0;return out()}
if(r.s===429)w=(r.w||3)*1000;
else if(r.s===200&&r.d&&r.d.item){
const d=r.d,t=nt(d.item),est=d.progress_ms+(b-a)/2,was=playing;
playing=d.is_playing;
if(!cur||cur.id!==t.id){cur=t;base=est;baseT=b;B.dataset.s='play';setTrack(t)}
else{
const cp=base+(was?b-baseT:0);
if(!was||!playing||Math.abs(est-cp)>400){base=est;baseT=b}
else{base=cp+(est-cp)*.3;baseT=b}
}
}else if(r.s===204||r.s===200){
if(cur){cur=null;gen++;playing=false;clearLyrics()}
B.dataset.s='idle';w=1500;
}
busy=0;pt=setTimeout(poll,w);
}

const de=document.documentElement,rq=de.requestFullscreen||de.webkitRequestFullscreen,ex=document.exitFullscreen||document.webkitExitFullscreen;
const isf=()=>document.fullscreenElement||document.webkitFullscreenElement;
if(!rq)fs.hidden=true;
fs.onclick=()=>{try{Promise.resolve(isf()?ex.call(document):rq.call(de)).catch(()=>0)}catch(e){}};
['fullscreenchange','webkitfullscreenchange'].forEach(e=>document.addEventListener(e,()=>B.classList.toggle('full',!!isf())));
let it;
const wake=()=>{B.classList.remove('idle');clearTimeout(it);it=setTimeout(()=>B.classList.add('idle'),2600)};
['pointermove','pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,wake,{passive:true}));
wake();
addEventListener('keydown',e=>{
const k=e.key;
if(k==='f'||k==='F')fs.click();
else if(k==='ArrowLeft'||k==='ArrowRight'){
adj+=k==='ArrowRight'?50:-50;LS.adj=adj;
toast.textContent=(adj>0?'+':'')+adj+' ms';toast.classList.add('s');
clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('s'),1100);
}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
new ResizeObserver(relayout).observe(right);
if(document.fonts)document.fonts.ready.then(relayout);
$('#go').onclick=login;

bg(DEF);
frame();
(async()=>{
const q=new URLSearchParams(location.search);
if(q.get('code')){
try{await tok({grant_type:'authorization_code',code:q.get('code'),redirect_uri:RU,code_verifier:LS.v})}catch(e){}
history.replaceState(null,'',RU);
}else if(q.get('error'))history.replaceState(null,'',RU);
if(await auth()){B.dataset.s='idle';poll()}else B.dataset.s='login';
})();
</script>
