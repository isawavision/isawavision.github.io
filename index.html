<script>
(function(){
'use strict';
var CLIENT_ID='ff5af985ee254039b6d172039edeea90';
var SCOPES='user-read-currently-playing user-read-playback-state';
var REDIRECT=location.origin+location.pathname.replace(/index\.html$/,'');

var AC='https://accounts.spotify.com';
var LR='https://lrclib.net/api';

var ls={
get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},
set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},
del:function(k){try{localStorage.removeItem(k)}catch(e){}}
};

var P={pos:0,t:0,playing:false,dur:0,has:false};

var auth=null,refreshing=null,polling=false,wakeQueued=false,misses=0,rl=0;

var shift=parseInt(ls.get('iv.shift'),10)||0;
var resolved=new Map(),pending=new Map();

function setView(v){if(app.dataset.view!==v)app.dataset.view=v;if(v!=='stage')document.title='isawavision'}
function msg(t){msgEl.textContent=t||''}

function rand(n){var a=new Uint8Array(n);crypto.getRandomValues(a);var s='';for(var i=0;i<n;i++)s+=CH[a[i]%CH.length];return s}
async function challenge(v){
var d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));

function loadAuth(){var s=ls.get('iv.auth');if(!s)return false;try{auth=JSON.parse(s);return !!(auth&&auth.rt)}catch(e){return false}}

var v=rand(96),s=rand(16);
ls.set('iv.v',v);ls.set('iv.s',s);
var c=await challenge(v);

async function exchange(code){
var r=await fetch(AC+'/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'authorization_code',code:code,redirect_uri:REDIRECT,code_verifier:ls.get('iv.v')||''})});

saveAuth(await r.json());
ls.del('iv.v');ls.del('iv.s')
}
function refresh(){
if(refreshing)return refreshing;

var r=await fetch(AC+'/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'refresh_token',refresh_token:auth.rt,client_id:CLIENT_ID})});

saveAuth(await r.json());
return auth.at
})();
var done=function(){refreshing=null};
refreshing.then(done,done);

}
async function token(){

}
async function api(path){

msg(m);setView('connect')
}

function posAt(now){
if(!P.playing)return P.pos;
var x=P.pos+(now-P.t);
return P.dur&&x>P.dur?P.dur:x
}
function wake(){
if(!auth)return;
if(polling){wakeQueued=true}else{clearTimeout(pollTimer);poll()}
}
async function poll(){
if(polling){wakeQueued=true;return}

clearTimeout(pollTimer);
var next=document.hidden?3000:POLL;
try{
var t0=performance.now();
var r=await api('/me/player/currently-playing?additional_types=episode');

if(r.status===204){gone()}
else if(r.status===200){
var j=null;
try{j=await r.json()}catch(e){}
if(j&&j.item!==undefined)take(j,t0,t1);else gone()
}else if(r.status===429){

polling=false;
signOut(r.status===403?'This Spotify account isn’t allowed to use this app yet.':'Your Spotify session expired. Connect again.');
return
}else{next=2500}
}catch(e){
if(e&&e.message==='auth'){polling=false;return}
next=2500

polling=false;
if(wakeQueued){wakeQueued=false;next=0}
pollTimer=setTimeout(poll,next)
}
function gone(){
misses++;
if(!cur.id){setView('idle');return}
if(misses>=3)goIdle()
}

cur.id=null;cur.tk++;
clearTimeout(endTimer);clearTimeout(pfTimer);
clearLyrics();setPalette(DEF);
P.has=false;P.playing=false;
setView('idle')
}
function tid(it){return it.id||it.uri||(it.name+'|'+(it.artists||[]).map(function(a){return a.name}).join(',')+'|'+it.duration_ms)}

var it=j.item;

var now=performance.now(),mid=(t0+t1)/2;

goBtn.addEventListener('click',function(){
goBtn.disabled=true;msg('');
login().catch(function(){goBtn.disabled=false;msg('Couldn’t reach Spotify. Try again.')})
});

async function boot(){
var q=new URLSearchParams(location.search);
var code=q.get('code'),st=q.get('state'),err=q.get('error');
if(code||err)history.replaceState(null,'',REDIRECT);
if(code){
if(st&&st===ls.get('iv.s')){
try{await exchange(code)}catch(e){msg('Couldn’t connect to Spotify. Try again.')}
}else{msg('Couldn’t verify the connection. Try again.')}
}else if(err){msg('Spotify access wasn’t granted.')}
if(loadAuth()){setView('boot');poll()}else{setView('connect')}
}
requestAnimationFrame(tick);
awake();
boot()
})();
</script>
</body>
</html>
