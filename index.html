<body>

<main id="app" data-s="boot" data-m="nl">
<section id="gate" class="mid"><h1>isawavision</h1><button id="go">Connect Spotify</button></section>

<script>
(()=>{
const CID='ff5af985ee254039b6d172039edeea90';
const RU=location.origin+location.pathname.replace(/index\.html$/,'');
const SCOPE='user-read-currently-playing user-read-playback-state';
const FB=['59,76,202','122,63,181','10,16,40'];
const $=s=>document.querySelector(s);
const app=$('#app'),art=$('#art'),meta=$('#meta'),lyr=$('#lyr'),bg=$('#bg'),fsb=$('#fs');
const store={
get:k=>{try{return localStorage.getItem(k)}catch{return null}},
set:(k,v)=>{try{localStorage.setItem(k,v)}catch{try{Object.keys(localStorage).filter(x=>x.startsWith('ly')).forEach(x=>localStorage.removeItem(x));localStorage.setItem(k,v)}catch{}}},
del:k=>{try{localStorage.removeItem(k)}catch{}}
};
let T=null,V=null,gen=0,A={pos:0,t:0,on:false,dur:0},busy=false,timer=0,started=false,offset=+store.get('off')||0;
const where=n=>Math.min(A.on?A.pos+n-A.t:A.pos,A.dur||1e9);
const state=s=>{app.dataset.s=s};
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function login(){
const v=b64(crypto.getRandomValues(new Uint8Array(48)));
store.set('pv',v);
const c=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:CID,response_type:'code',redirect_uri:RU,scope:SCOPE,code_challenge_method:'S256',code_challenge:c});
}
async function grant(body){
const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CID,...body})});
if(!r.ok)throw new Error(r.status===400||r.status===401?'auth':'net');
const j=await r.json(),o=JSON.parse(store.get('sp')||'{}');
const s={a:j.access_token,r:j.refresh_token||o.r,e:Date.now()+j.expires_in*1000};
store.set('sp',JSON.stringify(s));
return s;
}
let rp=null;
function token(force){
const s=JSON.parse(store.get('sp')||'null');
if(!s)return Promise.reject(new Error('auth'));
if(!force&&Date.now()<s.e-45000)return Promise.resolve(s.a);
rp=rp||grant({grant_type:'refresh_token',refresh_token:s.r}).then(x=>x.a).finally(()=>{rp=null});
return rp;
}
async function api(p,n){
const r=await fetch('https://api.spotify.com/v1'+p,{headers:{Authorization:'Bearer '+await token()}});
if(r.status===401&&!n){await token(true);return api(p,1)}
return r;
}
function out(){store.del('sp');T=null;V=null;gen++;started=false;state('gate')}
async function boot(){
const q=new URLSearchParams(location.search);
if(q.get('code')){
const v=store.get('pv');
history.replaceState(null,'',location.pathname);
try{await grant({grant_type:'authorization_code',code:q.get('code'),redirect_uri:RU,code_verifier:v})}catch{}
store.del('pv');
}else if(q.get('error'))history.replaceState(null,'',location.pathname);
if(store.get('sp')){started=true;state('idle');poll()}else state('gate');
}
const toHsl=(r,g,b)=>{r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b),l=(M+m)/2,d=M-m;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=(M===r?((g-b)/d+6)%6:M===g?(b-r)/d+2:(r-g)/d+4)*60}return[h,s,l]};
const toRgb=(h,s,l)=>{const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};return f(0)+','+f(8)+','+f(4)};
const hd=(a,b)=>{const q=Math.abs(a-b)%360;return Math.min(q,360-q)};
const cl=(a,lo,hi)=>Math.max(lo,Math.min(hi,a));
function palette(img){
const n=28,c=document.createElement('canvas');c.width=c.height=n;
const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,n,n);
const d=x.getImageData(0,0,n,n).data,B=[];
for(let k=0;k<12;k++)B.push({w:0,h:0,s:0,l:0});
let al=0;
for(let i=0;i<d.length;i+=4){
const[h,s,l]=toHsl(d[i],d[i+1],d[i+2]);al+=l;
const w=s*(1-Math.abs(2*l-1))+.001,b=B[Math.floor(h/30)%12];
b.w+=w;b.h+=h*w;b.s+=s*w;b.l+=l*w;
}
al/=n*n;
B.sort((a,b)=>b.w-a.w);
if(B[0].w<n*n*.04)return[toRgb(225,.22,.34),toRgb(240,.25,.22),toRgb(225,.3,Math.max(.05,al*.2))];
const f=b=>({h:b.h/b.w,s:b.s/b.w,l:b.l/b.w}),t=f(B[0]);
const o=B.slice(1).find(b=>b.w>B[0].w*.25&&hd(f(b).h,t.h)>=40);
const v=o?f(o):{h:(t.h+35)%360,s:t.s,l:t.l};

}
const layers=[0,1,2].map(()=>{const l=document.createElement('div');l.className='l';l.innerHTML='<i></i><i></i><i></i>';bg.appendChild(l);return l});
let li=0,z=1,bgT=0;
function setBg(p){
const n=layers[li=(li+1)%3];
p.forEach((c,i)=>n.style.setProperty('--r'+i,c));
n.style.zIndex=++z;
n.classList.remove('on');void n.offsetWidth;n.classList.add('on');
clearTimeout(bgT);
bgT=setTimeout(()=>layers.forEach(l=>{if(l!==n)l.classList.remove('on')}),1700);
}
const imgs=new Map();
function loadImg(u){
if(!u)return Promise.resolve(null);
let p=imgs.get(u);
if(!p){
p=new Promise(res=>{
const i=new Image();i.crossOrigin='anonymous';
i.onload=()=>{let q;try{q=palette(i)}catch{q=FB}res({p:q,c:true})};
i.onerror=()=>{const j=new Image();j.onload=()=>res({p:FB,c:false});j.onerror=()=>res(null);j.src=u};
i.src=u;
});
imgs.set(u,p);
if(imgs.size>60)imgs.delete(imgs.keys().next().value);
}
return p;
}
function retire(o,ms){o.classList.remove('in');o.classList.add('out');setTimeout(()=>o.remove(),ms+120)}
function swap(host,el,ms){
[...host.children].forEach(o=>retire(o,ms));
host.appendChild(el);
requestAnimationFrame(()=>requestAnimationFrame(()=>{if(el.isConnected&&!el.classList.contains('out'))el.classList.add('in')}));
}
async function cover(u,g){
const r=await loadImg(u);
if(g!==gen)return;
const el=document.createElement(r?'img':'div');
el.className='cv'+(r?'':' ph');
if(r){el.alt='';if(r.c)el.crossOrigin='anonymous';el.src=u;try{await el.decode()}catch{}if(g!==gen)return}
const p=r?r.p:FB;
el.style.setProperty('--g',p[0]);
swap(art,el,700);
setBg(p);
}
const norm=s=>(s||'').toLowerCase().replace(/\(.*?\)|\[.*?\]/g,'').replace(/[^\p{L}\p{N}]+/gu,'');
const like=(a,b)=>{a=norm(a);b=norm(b);return!!a&&!!b&&(a.includes(b)||b.includes(a))};
const clean=s=>s.replace(/\s[-–]\s.*(remaster|version|mix|edit|live|mono|stereo|deluxe|bonus).*$/i,'').replace(/\s*[\(\[]\s*(feat|ft|with)\.?[^\)\]]*[\)\]]/ig,'').trim();
async function jf(u){
const c=new AbortController(),tm=setTimeout(()=>c.abort(),6500);
try{const r=await fetch(u,{signal:c.signal});if(r.status===404)return null;if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(tm)}
}
async function find(t){
const key='ly'+t.id,hit=store.get(key);
if(hit){try{return JSON.parse(hit)}catch{}}
const nm=clean(t.name),ar=t.artists[0]||'',du=Math.round(t.dur/1000);
const ok=r=>r&&like(r.trackName,nm)&&t.artists.some(a=>like(r.artistName,a));
const near=r=>Math.abs((r.duration||0)-du)<=3;
const q=o=>new URLSearchParams(o).toString(),L='https://lrclib.net/api/';
const pick=pool=>{
const c=pool.filter(r=>ok(r)&&!r.instrumental);
const s=c.filter(r=>r.syncedLyrics&&near(r)).sort((x,y)=>Math.abs(x.duration-du)-Math.abs(y.duration-du))[0];
if(s)return{s:s.syncedLyrics};
const p=c.find(r=>r.plainLyrics);
return p?{p:p.plainLyrics}:null;
};
const done=r=>{store.set(key,JSON.stringify(r));return r};
const first=jf(L+'get?'+q({track_name:t.name,artist_name:ar,album_name:t.album,duration:du})).catch(()=>undefined);
const p1=jf(L+'search?'+q({track_name:nm,artist_name:ar})).catch(()=>undefined);
const p2=jf(L+'search?'+q({q:ar+' '+nm})).catch(()=>undefined);
const g=await first;
if(g&&ok(g)&&g.instrumental)return null;
const e=g&&ok(g)?pick([g]):null;
if(e&&e.s)return done(e);
const[a,b]=await Promise.all([p1,p2]);
if(g===undefined&&a===undefined&&b===undefined)throw 0;
const res=pick([g,...(a||[]),...(b||[])].filter(Boolean));
if(res)return done(res);
try{

}catch{}
return null;
}
const lc=new Map();
function lyrics(t){
if(t.ep)return Promise.resolve(null);
let p=lc.get(t.id);
if(!p){
p=find(t).catch(()=>{lc.delete(t.id);return undefined});
lc.set(t.id,p);
if(lc.size>80)lc.delete(lc.keys().next().value);
}
return p;
}
function lrc(s){
const o=[];
for(const row of s.split(/\r?\n/)){
const tags=[...row.matchAll(/\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g)];
if(!tags.length)continue;
const x=row.replace(/\[\d{1,3}:\d{1,2}(?:[.:]\d{1,3})?\]/g,'').trim();
for(const m of tags)o.push({t:(+m[1]*60+ +m[2])*1000+(m[3]?+(m[3]+'00').slice(0,3):0),x});
}
return o.sort((a,b)=>a.t-b.t);
}
function split(x){
const a=[];
const m=x.replace(/\(([^)]*)\)/g,(_,s)=>{s=s.trim();if(s)a.push(s);return' '}).replace(/\s+/g,' ').replace(/\s+([,.!?;:])/g,'$1').trim();
return{m:m.replace(/^[,.;:\s]+$/,''),a:a.join(' · ')};
}
function rowsOf(r){
const rows=[];
if(r.s){
const raw=lrc(r.s);
raw.forEach((o,i)=>{
const s=split(o.x);
if(!s.m&&!s.a){const nx=raw[i+1],last=rows[rows.length-1];if(nx&&nx.t-o.t>=5000&&!(last&&last.d))rows.push({t:o.t,d:1});return}
rows.push({t:o.t,m:s.m,a:s.a});
});
if(rows.length&&rows[0].t>=5000)rows.unshift({t:0,d:1});
}else{
r.p.split(/\r?\n/).map(x=>x.trim()).filter(x=>!/^\[.*\]$/.test(x)).forEach(x=>{
const last=rows[rows.length-1];
if(!x){if(last&&!last.sp)rows.push({sp:1});return}
const s=split(x);
if(s.m||s.a)rows.push({m:s.m,a:s.a});
});
}
return rows;
}
function mount(r,g){
const rows=rowsOf(r);
if(!rows.length){app.dataset.m='nl';return}
app.dataset.m='ly';
const trk=document.createElement('div'),rail=document.createElement('div'),els=[],ts=[];
trk.className='trk'+(r.s?'':' plain');rail.className='rail';trk.appendChild(rail);
rows.forEach(w=>{
const e=document.createElement('div');e.className='ln';
if(w.d){e.className+=' dt';e.innerHTML='<i></i><i></i><i></i>'}
else if(w.sp)e.className+=' sp';
else{
if(w.m){const m=document.createElement('span');m.className='m';m.textContent=w.m;e.appendChild(m)}
if(w.a){const a=document.createElement('span');a.className='a';a.textContent=w.a;e.appendChild(a)}
if(!w.m)e.className+=' ad';
}
rail.appendChild(e);els.push(e);ts.push(w.t);
});
const v={trk,rail,els,ts,i:-2,plain:!r.s};
swap(lyr,trk,600);
V=v;
if(!v.plain)sync(v,true);
}
function place(v,now){
const e=v.els[Math.max(v.i,0)];
if(!e)return;
const y=v.trk.clientHeight*.36-(e.offsetTop+e.offsetHeight/2);
if(now)v.rail.style.transition='none';
v.rail.style.transform='translate3d(0,'+y+'px,0)';
if(now){void v.rail.offsetWidth;v.rail.style.transition=''}
}
function sync(v,now){
const p=where(performance.now())+offset;
let lo=0,hi=v.ts.length;
while(lo<hi){const m=(lo+hi)>>1;v.ts[m]<=p?lo=m+1:hi=m}
const i=lo-1;
if(i===v.i&&!now)return;
v.i=i;
v.els.forEach((e,k)=>{const d=k-i;e.style.setProperty('--d',Math.min(Math.abs(d),6));e.classList.toggle('on',d===0);e.classList.toggle('past',d<0)});
place(v,now);
}
async function lyricsFor(t,g,n=0){
const r=await lyrics(t);
if(g!==gen)return;
if(r===undefined){if(n<6)setTimeout(()=>lyricsFor(t,g,n+1),3000+n*2000);return}
if(!r){app.dataset.m='nl';return}
mount(r,g);
}
const info=it=>{
const im=(it.album&&it.album.images)||it.images||(it.show&&it.show.images)||[];
return{id:it.uri||it.id,name:it.name||'',artists:it.artists&&it.artists.length?it.artists.map(a=>a.name):[it.show?it.show.publisher:''].filter(Boolean),album:it.album?it.album.name:'',dur:it.duration_ms||0,img:im[0]&&im[0].url,ep:it.type==='episode'};
};

(j.queue||[]).slice(0,3).forEach(it=>{const t=info(it);lyrics(t);loadImg(t.img)});

}

T=t;V=null;
[...lyr.children].forEach(o=>retire(o,300));
state('play');
const m=document.createElement('div'),b=document.createElement('b'),s=document.createElement('span');
m.className='mi';b.textContent=t.name;s.textContent=t.artists.join(', ');
m.append(b,s);
swap(meta,m,500);
cover(t.img,g);
lyricsFor(t,g).then(()=>{if(g===gen)ahead()});
}
function idle(){
A.on=false;
if(T){T=null;V=null;gen++;[...lyr.children].forEach(o=>retire(o,300))}
app.classList.remove('paused');
state('idle');
}
function take(d,t0,t1){
const it=d.item,id=it.uri||it.id,pos=d.progress_ms+(t1-t0)/2;
if(!T||T.id!==id){A={pos,t:t1,on:d.is_playing,dur:it.duration_ms||0};change(it)}
else{
const c=where(t1),df=pos-c;
A=(!A.on||!d.is_playing||Math.abs(df)>350)?{pos,t:t1,on:d.is_playing,dur:A.dur}:{pos:c+df*.3,t:t1,on:true,dur:A.dur};
}
app.classList.toggle('paused',!d.is_playing);
}
async function poll(){
if(busy||!started)return;
busy=true;clearTimeout(timer);
let wait=1000;
try{
const t0=performance.now(),r=await api('/me/player/currently-playing?additional_types=episode'),t1=performance.now();
if(r.status===429)wait=(+r.headers.get('Retry-After')||3)*1000+300;
else if(r.status===204)idle();
else if(r.ok){
const d=await r.json().catch(()=>null);
if(d&&d.item){
take(d,t0,t1);
const rem=A.dur-where(performance.now());
wait=A.on?(A.dur>0&&rem<1400?Math.max(250,rem+70):1000):1500;
}else idle();
}
}catch(e){
if(e&&e.message==='auth'){busy=false;out();return}
wait=2000;
}
busy=false;
timer=setTimeout(poll,wait);
}
const fit=()=>{
const s=document.documentElement.style;
s.setProperty('--x',innerWidth/100+'px');
s.setProperty('--y',innerHeight/100+'px');
if(V&&!V.plain)place(V,true);
};
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function toggleFs(){
const d=document.documentElement;
try{
const r=fsEl()?(document.exitFullscreen||document.webkitExitFullscreen).call(document):(d.requestFullscreen||d.webkitRequestFullscreen).call(d);
if(r&&r.catch)r.catch(()=>{});
}catch{}
}
if(!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen))fsb.hidden=true;
['fullscreenchange','webkitfullscreenchange'].forEach(e=>document.addEventListener(e,()=>{document.body.classList.toggle('fsa',!!fsEl());fit()}));
let at=0;
const act=()=>{document.body.classList.add('act');clearTimeout(at);at=setTimeout(()=>document.body.classList.remove('act'),2600)};
['pointermove','pointerdown','keydown'].forEach(e=>addEventListener(e,act,{passive:true}));
addEventListener('keydown',e=>{
if(e.key==='f'||e.key==='F')toggleFs();
else if(e.key==='['||e.key===']'){offset+=e.key===']'?50:-50;store.set('off',offset)}
});

document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});

$('#go').onclick=login;
fsb.onclick=toggleFs;
fit();
setBg(FB);
if(document.fonts)document.fonts.ready.then(fit);
requestAnimationFrame(function f(){if(V&&!V.plain)sync(V);requestAnimationFrame(f)});
boot();
})();
