<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>isawavision</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
@property --c1{syntax:'<color>';inherits:true;initial-value:hsl(230 40% 30%)}
@property --c2{syntax:'<color>';inherits:true;initial-value:hsl(260 40% 26%)}
@property --c3{syntax:'<color>';inherits:true;initial-value:hsl(235 40% 8%)}
:root{transition:--c1 1.4s ease,--c2 1.4s ease,--c3 1.4s ease}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:var(--c3);-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 30% 50%,transparent 20%,rgba(0,0,0,.45) 100%);pointer-events:none}
#bg{position:fixed;inset:0;z-index:-2;background:var(--c3);overflow:hidden}
#bg i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.75;animation:drift 28s ease-in-out infinite alternate}
#bg i:nth-child(1){background:var(--c1);left:-20vmax;top:-20vmax}
#bg i:nth-child(2){background:var(--c2);right:-25vmax;bottom:-25vmax;animation-duration:34s;animation-delay:-9s}
#bg i:nth-child(3){background:var(--c1);left:30vw;top:35vh;width:45vmax;height:45vmax;opacity:.4;animation-delay:-17s}
@keyframes drift{to{transform:translate(12vmax,8vmax) rotate(40deg) scale(1.15)}}
#app,#login,#wait{display:none}
body[data-s=play] #app{display:grid}
body[data-s=login] #login,body[data-s=wait] #wait{display:flex}
#login,#wait{position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:28px;animation:rise .9s ease both}
#login h2{font-size:clamp(1.8rem,5vw,3rem);font-weight:800;letter-spacing:-.04em}
#login button{font:inherit;font-weight:600;font-size:1rem;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:14px 32px;border-radius:999px;cursor:pointer;backdrop-filter:blur(12px);transition:background .25s,transform .25s}
#login button:hover{background:rgba(255,255,255,.24);transform:scale(1.04)}
#wait span{font-size:.95rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.55);animation:pulse 2.4s ease-in-out infinite}
#wait b{width:10px;height:10px;border-radius:50%;background:#fff;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
#app{height:100vh;height:100dvh;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);align-items:center;transition:grid-template-columns 1s cubic-bezier(.2,.8,.2,1);animation:rise .9s ease both}
body.solo #app{grid-template-columns:minmax(0,1fr) minmax(0,0fr)}
#side{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 3vw;gap:6px}
#art{width:min(30vw,52vh);aspect-ratio:1;object-fit:cover;border-radius:14px;background:rgba(255,255,255,.08);box-shadow:0 40px 90px -25px color-mix(in srgb,var(--c1) 75%,#000);transition:width 1s cubic-bezier(.2,.8,.2,1)}
#art.f{animation:rise .8s ease}
body.solo #art{width:min(80vw,58vh)}
#ttl{margin-top:22px;font-size:clamp(1rem,1.5vw,1.35rem);font-weight:800;letter-spacing:-.01em;max-width:min(30vw,52vh);transition:max-width 1s}
body.solo #ttl{max-width:min(80vw,58vh)}
#sub{font-size:clamp(.85rem,1.1vw,1rem);font-weight:600;color:rgba(255,255,255,.55)}
#lyr{height:100vh;height:100dvh;overflow:hidden;transition:opacity .8s;-webkit-mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent);mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent)}
body.solo #lyr{opacity:0;pointer-events:none}
#box{transition:transform .75s cubic-bezier(.22,.85,.2,1);will-change:transform}
.l{font-size:clamp(1.5rem,3vw,2.9rem);font-weight:800;line-height:1.18;letter-spacing:-.025em;padding:.42em 5vw .42em 2vw;cursor:pointer;transform-origin:left center;transform:scale(.94);opacity:max(.16,calc(.62 - var(--d,9) * .1));filter:blur(min(calc(var(--d,9) * .9px),5px));transition:opacity .55s,filter .55s,transform .55s cubic-bezier(.22,.85,.2,1),text-shadow .55s}
.l.g{letter-spacing:.2em}
.l.on{opacity:1;filter:none;transform:scale(1);text-shadow:0 0 34px rgba(255,255,255,.35)}
.l:hover{opacity:max(.7,calc(.62 - var(--d,9) * .1))}
@media(max-width:800px){
#app,body.solo #app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);align-items:start}
body.solo #app{grid-template-rows:1fr 0fr;align-items:center}
#side{padding-top:6vh}
#art{width:min(46vw,30vh)}
#ttl{max-width:80vw}
body.solo #art{width:min(72vw,50vh)}
#lyr{height:100%;min-height:0}
.l{font-size:clamp(1.35rem,6vw,2rem);padding:.4em 6vw}
}
</style>
</head>
<body data-s="boot">
<div id="bg"><i></i><i></i><i></i></div>
<div id="login"><h2>isawavision</h2><button id="go">Connect Spotify</button></div>
<div id="wait"><b></b><span>Waiting for music</span></div>
<main id="app">
<section id="side"><img id="art" alt=""><h1 id="ttl"></h1><p id="sub"></p></section>
<section id="lyr"><div id="box"></div></section>
</main>
<script>
const CID='ff5af985ee254039b6d172039edeea90';
const REDIRECT=location.origin+location.pathname;
const SCOPE='user-read-playback-state user-read-currently-playing user-modify-playback-state';
const LEAD=.15;
const K='iwv';
const $=id=>document.getElementById(id);
const art=$('art'),ttl=$('ttl'),sub=$('sub'),box=$('box'),lyr=$('lyr');
let cur=null,seq=0,timer=0,lines=[],els=[],act=-2;
let anchor={pos:0,at:0,playing:false};

const setState=s=>{document.body.dataset.s=s};
const store=()=>JSON.parse(localStorage.getItem(K)||'null');

async function tokenReq(body){
const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)});
if(!r.ok)throw 0;
const j=await r.json();
const s={a:j.access_token,r:j.refresh_token||(store()||{}).r,e:Date.now()+j.expires_in*1000-30000};
localStorage.setItem(K,JSON.stringify(s));
return s;
}

async function token(){
let s=store();
if(!s)return null;
if(Date.now()>s.e){
try{s=await tokenReq({grant_type:'refresh_token',refresh_token:s.r,client_id:CID})}
catch{localStorage.removeItem(K);return null}
}
return s.a;
}

async function login(){
const chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
const v=[...crypto.getRandomValues(new Uint8Array(64))].map(n=>chars[n%62]).join('');
localStorage.setItem(K+'v',v);
const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
const c=btoa(String.fromCharCode(...new Uint8Array(h))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:CID,response_type:'code',redirect_uri:REDIRECT,scope:SCOPE,code_challenge_method:'S256',code_challenge:c});
}

async function api(path,opt={}){
const t=await token();
if(!t){clearTimeout(timer);setState('login');throw 0}
return fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+t}});
}

const pos=()=>anchor.playing?anchor.pos+performance.now()-anchor.at:anchor.pos;

function idle(){
cur=null;
seq++;
anchor.playing=false;
setState('wait');
document.title='isawavision';
}

async function poll(){
clearTimeout(timer);
let wait=2500;
try{
const t0=performance.now();
const r=await api('/me/player');
const t1=performance.now();
if(r.status===429){wait=(+r.headers.get('retry-after')||5)*1000}
else if(r.status===204||!r.ok){idle()}
else{
const j=await r.json();
if(!j.item||j.item.type!=='track'){idle()}
else{
setState('play');
setTrack(j.item);
const mid=t0+(t1-t0)/2;
const np=j.progress_ms+(j.is_playing?performance.now()-mid:0);
if(j.is_playing&&anchor.playing){
const d=np-pos();
if(Math.abs(d)<300){anchor={pos:pos()+d*.3,at:performance.now(),playing:true}}
else{anchor={pos:np,at:performance.now(),playing:true}}
}else{
anchor={pos:np,at:performance.now(),playing:j.is_playing};
}
if(j.is_playing)wait=Math.min(2000,Math.max(250,j.item.duration_ms-np+250));
}
}
}catch{}
timer=setTimeout(poll,wait);
}

function setTrack(it){
const id=it.id||it.uri;
if(id===cur)return;
cur=id;
const my=++seq;
ttl.textContent=it.name;
sub.textContent=it.artists.map(a=>a.name).join(', ');
document.title=it.name+' · '+it.artists[0].name;
lines=[];els=[];act=-2;box.innerHTML='';
const im=it.album.images[0];
if(im)cover(im.url,my);
lyrics({name:it.name,clean:clean(it.name),artist:it.artists[0].name,album:it.album.name,dur:it.duration_ms/1000},my);
}

const clean=n=>n.replace(/\s*[\(\[].*?[\)\]]/g,'').replace(/\s+-\s+.*$/,'').trim();

function cover(u,my){
const i=new Image();
i.crossOrigin='anonymous';
i.onload=()=>{
if(my!==seq)return;
try{colors(i)}catch{}
art.src=u;
art.classList.remove('f');
void art.offsetWidth;
art.classList.add('f');
};
i.src=u;
}

function hsl(r,g,b){
r/=255;g/=255;b/=255;
const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
let h=0,s=0;
if(d){
s=d/(1-Math.abs(2*l-1));
h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;
h=(h*60+360)%360;
}
return{h,s,l};
}

function colors(img){
const c=document.createElement('canvas');
c.width=c.height=48;
const x=c.getContext('2d',{willReadFrequently:true});
x.drawImage(img,0,0,48,48);
const d=x.getImageData(0,0,48,48).data;
const b={};
for(let i=0;i<d.length;i+=4){
if(d[i+3]<200)continue;
const k=(d[i]>>5)<<6|(d[i+1]>>5)<<3|(d[i+2]>>5);
const o=b[k]||(b[k]={n:0,r:0,g:0,b:0});
o.n++;o.r+=d[i];o.g+=d[i+1];o.b+=d[i+2];
}
const list=Object.values(b).map(o=>{
const v=hsl(o.r/o.n,o.g/o.n,o.b/o.n);
v.sc=o.n*(.15+v.s)*(v.l>.12&&v.l<.88?1:.3);
return v;
}).sort((p,q)=>q.sc-p.sc);
const p=list[0];
const hd=(a,z)=>Math.min(Math.abs(a-z),360-Math.abs(a-z));
const q=list.find(v=>hd(v.h,p.h)>35&&v.s>.15)||{h:(p.h+28)%360,s:p.s,l:p.l};
const cl=(v,a,z)=>Math.min(z,Math.max(a,v));
const sat=s=>s<.15?s:Math.max(s,.42);
const f=(h,s,l)=>`hsl(${Math.round(h)} ${Math.round(s*100)}% ${Math.round(l*100)}%)`;
const st=document.documentElement.style;
st.setProperty('--c1',f(p.h,cl(sat(p.s),0,.9),cl(p.l,.32,.5)));
st.setProperty('--c2',f(q.h,cl(sat(q.s),0,.9),cl(q.l,.26,.44)));
st.setProperty('--c3',f(p.h,Math.min(.5,p.s),.08));
}

const J=async(u,proxy)=>{
const c=new AbortController();
const to=setTimeout(()=>c.abort(),8000);
try{
const r=await fetch(proxy?'https://api.allorigins.win/raw?url='+encodeURIComponent(u):u,{signal:c.signal});
if(!r.ok)return null;
return JSON.parse(await r.text());
}catch{return null}
finally{clearTimeout(to)}
};

const Q=o=>new URLSearchParams(o);
const near=(a,m)=>Math.abs(a-m.dur);

function pick(a,m){
if(!Array.isArray(a))return null;
const c=a.filter(x=>x.syncedLyrics&&near(x.duration,m)<=3).sort((x,y)=>near(x.duration,m)-near(y.duration,m));
return c[0]&&c[0].syncedLyrics;
}

const sources=[
async m=>{
const j=await J('https://lrclib.net/api/get?'+Q({track_name:m.name,artist_name:m.artist,album_name:m.album,duration:Math.round(m.dur)}));
return j&&j.syncedLyrics;
},
async m=>pick(await J('https://lrclib.net/api/search?'+Q({track_name:m.clean,artist_name:m.artist})),m),
async m=>pick(await J('https://lrclib.net/api/search?'+Q({q:m.clean+' '+m.artist})),m),
async m=>{
const s=await J('https://music.163.com/api/search/get?'+Q({s:m.clean+' '+m.artist,type:1,limit:8}),1);
const l=s&&s.result&&s.result.songs;
if(!l)return null;
const c=l.filter(x=>Math.abs(x.duration/1000-m.dur)<=3).sort((x,y)=>Math.abs(x.duration/1000-m.dur)-Math.abs(y.duration/1000-m.dur));
for(const x of c.slice(0,2)){
const y=await J('https://music.163.com/api/song/lyric?'+Q({id:x.id,lv:1,tv:-1}),1);
const t=y&&y.lrc&&y.lrc.lyric;
if(t&&/\[\d+:\d+/.test(t))return t;
}
return null;
}
];

function parse(t){
if(!t)return[];
const out=[];
for(const row of t.split('\n')){
const re=/\[(\d+):(\d+(?:\.\d+)?)\]/g;
const ts=[];
let m,last=0;
while((m=re.exec(row))){ts.push(+m[1]*60+ +m[2]);last=re.lastIndex}
if(!ts.length)continue;
const s=row.slice(last).trim();
if(/^(作词|作曲|编曲|制作人|词|曲)\s*[:：]/.test(s))continue;
ts.forEach(x=>out.push({t:x,s}));
}
return out.sort((a,b)=>a.t-b.t);
}

async function lyrics(m,my){
const ps=sources.map(f=>f(m).catch(()=>null));
for(const p of ps){
const t=await p;
if(my!==seq)return;
const ls=parse(t);
if(ls.filter(l=>l.s).length>1){build(ls);return}
}
if(my===seq)build([]);
}

function build(ls){
lines=ls;
box.innerHTML='';
els=ls.map(l=>{
const d=document.createElement('div');
d.className='l'+(l.s?'':' g');
d.textContent=l.s||'♪';
d.onclick=()=>seek(l.t);
box.appendChild(d);
return d;
});
act=-2;
document.body.classList.toggle('solo',!ls.length);
if(ls.length)paint();
}

function seek(s){
api('/me/player/seek?position_ms='+Math.round(s*1000),{method:'PUT'}).catch(()=>{});
anchor={pos:s*1000,at:performance.now(),playing:anchor.playing};
}

function paint(){
if(!els.length)return;
const a=Math.max(act,0);
els.forEach((e,n)=>{
e.style.setProperty('--d',Math.abs(n-act));
e.classList.toggle('on',n===act);
});
const e=els[a];
box.style.transform=`translateY(${lyr.clientHeight/2-e.offsetTop-e.offsetHeight/2}px)`;
}

function frame(){
if(lines.length){
const t=pos()/1000+LEAD;
let lo=0,hi=lines.length-1,i=-1;
while(lo<=hi){
const m=(lo+hi)>>1;
if(lines[m].t<=t){i=m;lo=m+1}else hi=m-1;
}
if(i!==act){act=i;paint()}
}
requestAnimationFrame(frame);
}

addEventListener('resize',paint);
$('go').onclick=login;

(async()=>{
const p=new URLSearchParams(location.search);
if(p.get('code')){
try{
await tokenReq({grant_type:'authorization_code',code:p.get('code'),redirect_uri:REDIRECT,client_id:CID,code_verifier:localStorage.getItem(K+'v')});
}catch{}
history.replaceState(null,'',location.pathname);
}
if(await token()){
setState('wait');
poll();
requestAnimationFrame(frame);
}else{
setState('login');
}
})();
</script>
</body>
</html>
